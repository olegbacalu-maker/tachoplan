<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F1B2E">
<meta name="description" content="TachoPlan Fleet — EU 561/2006 planning board for up to 60 trucks">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TachoPlan Fleet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- Inter, shipped with the app ----------
   Local files, never fonts.gstatic.com: the planner must look identical offline
   and on a machine where Inter is not installed. One @font-face per character
   subset, weight declared as the RANGE 100 900 — these files are variable, so a
   single rule serves 400 body, 600 headings and 700 numbers. Splitting them per
   weight would ship the same bytes four times and silently lose 700.
   font-display:swap → text paints in the system font immediately. */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/inter-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/inter-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/inter-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('fonts/inter-cyrillic-ext.woff2') format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}

/* ---------- design tokens ----------
   Two groups, and they must not be mixed. BRAND (blue) is interface: buttons,
   links, focus, the active nav item. MEANING is the tachograph itself — amber
   is driving, steel blue is other work, green is a break; and for a tour:
   green LEGAL, amber RISK, red VIOLATION. That is why the primary action is
   NOT amber here: on this board amber already means "risk", and a primary
   button in that colour would read as a warning. */
:root{
  --bg:#F4F6FA;--panel:#FFFFFF;--panel2:#F8FAFC;--line:#E3E8F0;--line2:#EEF2F7;
  --text:#131A29;--text2:#66748C;--text3:#95A0B4;
  --brand:#2563EB;--brand-d:#1D4ED8;--brand-soft:#EFF4FF;--brand-line:#D5E2FF;
  --brand-ring:rgba(37,99,235,.16);--on-brand:#FFFFFF;
  --side:#0F1B2E;--side2:#1A2942;--on-side:#E9EEF7;--on-side2:#8DA0BF;
  --drive:#F59E0B;--drive2:#FBBF24;--work:#3B82F6;--swap:#7C3AED;--brk:#10B981;
  --ok:#10B981;--ok-t:#047857;--ok-soft:#ECFDF5;
  --risk:#F59E0B;--risk-t:#B45309;--risk-soft:#FFFBEB;
  --bad:#EF4444;--bad-t:#B91C1C;--bad-soft:#FEF2F2;
  --r-card:16px;--r-ctl:10px;--h-ctl:38px;
  /* two-layer shadows: the near layer seats the card on the background and
     draws its edge, the far one gives depth. One layer looks dirty or flat. */
  --sh:0 1px 2px rgba(15,23,42,.05),0 6px 16px rgba(15,23,42,.05);
  --sh2:0 2px 4px rgba(15,23,42,.05),0 10px 24px rgba(15,23,42,.07);
  --sh3:0 3px 6px rgba(15,23,42,.07),0 16px 36px rgba(15,23,42,.10);
}
[data-theme="dark"]{
  --bg:#0D1220;--panel:#141C2E;--panel2:#1B2439;--line:#26314A;--line2:#1F2839;
  --text:#E8EDF7;--text2:#93A0B8;--text3:#6C7A93;
  --brand:#5B9DFF;--brand-d:#7DB2FF;--brand-soft:#16233C;--brand-line:#274068;
  --brand-ring:rgba(91,157,255,.22);--on-brand:#08111F;
  --side:#0A0F1C;--side2:#151F33;
  --swap:#A78BFA;
  --ok-t:#34D399;--risk-t:#FBBF24;--bad-t:#F87171;
  --ok-soft:#10241D;--risk-soft:#2A2113;--bad-soft:#2C1618;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --sh2:0 2px 4px rgba(0,0,0,.32),0 10px 24px rgba(0,0,0,.34);
  --sh3:0 3px 6px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.5;display:flex;min-height:100vh;
  font-family:'Inter','Segoe UI Variable Text','Segoe UI',system-ui,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
/* Figures that sit in a column or get rewritten in place need equal-width digits,
   otherwise 1 is narrower than 7 and the column stops lining up. */
.tnum,.tl-h,.kv b,.hrs,.slotv,.daychip b,.bl b{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--brand-ring)}

/* ---------- sidebar ---------- */
.side{width:220px;flex:0 0 220px;background:var(--side);color:var(--on-side);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;margin:0;font-size:inherit;font-weight:inherit;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.09)}
/* Present to a screen reader, invisible on screen — used to name controls that
   carry only an icon, and to give the page a real heading. */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.brand .mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--drive);
  color:#25190A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:-.5px}
.brand .nm{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.15}
.brand .nm small{display:block;font-size:10.5px;font-weight:500;letter-spacing:1.4px;color:var(--on-side2);margin-top:1px}
.snav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--on-side2);border-radius:9px;
  padding:9px 11px;font-size:13.5px;font-weight:500}
.snav button:hover{background:rgba(255,255,255,.06);color:var(--on-side)}
.snav button.on{background:var(--side2);color:#fff;font-weight:600}
.snav button svg{width:17px;height:17px;flex:0 0 17px;stroke-width:1.9}
.snav .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--on-side2);
  background:rgba(255,255,255,.08);border-radius:20px;padding:1px 7px}
.legend{margin-top:auto;padding:14px 16px 16px;font-size:11.5px;color:var(--on-side2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.legend .lt{font-size:10px;letter-spacing:1.4px;font-weight:600;margin-bottom:8px;color:#7C8DAB}
.legend div.li{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.legend i{width:12px;height:8px;border-radius:2px;display:block;flex:0 0 12px}
.legend .ver{margin-top:11px;font-size:10.5px;color:#5E6E8C}

/* ---------- topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dnav{display:flex;align-items:center;gap:6px}
.iconbtn{width:var(--h-ctl);height:var(--h-ctl);border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;color:var(--text2)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn svg{width:17px;height:17px;stroke-width:2}
.dlab{min-width:126px;text-align:center;line-height:1.15}
.dlab b{font-size:15px;font-weight:650}
.dlab span{display:block;font-size:10.5px;letter-spacing:1.3px;font-weight:600;color:var(--text3)}
.dlab span.today{color:var(--brand)}
.field{height:var(--h-ctl);border:1px solid var(--line);background:var(--panel);border-radius:var(--r-ctl);
  padding:0 11px;font-size:13px;outline:none;color:var(--text)}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
input[type=date].field,input[type=time].field{color-scheme:light}
[data-theme="dark"] input[type=date].field,[data-theme="dark"] input[type=time].field{color-scheme:dark}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--text3);pointer-events:none;stroke-width:2}
.search input{padding-left:32px;width:180px}
.btn{height:var(--h-ctl);border:1px solid var(--line);background:var(--panel);color:var(--text2);
  border-radius:var(--r-ctl);padding:0 14px;font-size:13px;font-weight:550;display:inline-flex;
  align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600;
  box-shadow:0 1px 2px rgba(15,23,42,.1),0 6px 16px var(--brand-ring)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:var(--on-brand)}
.btn.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}
.btn.danger{color:var(--bad-t);border-color:var(--line)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad-t)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:8px}

/* ---------- content ---------- */
.content{padding:20px 22px 64px;flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:13px 15px;
  box-shadow:var(--sh);display:flex;gap:11px;align-items:center}
.tile .ico{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;background:var(--brand-soft);color:var(--brand)}
.tile .ico svg{width:19px;height:19px;stroke-width:1.9}
.tile .kv{min-width:0}
.kv b{display:block;font-size:21px;font-weight:650;line-height:1.15;letter-spacing:-.4px}
.kv span{font-size:11.5px;color:var(--text2);font-weight:500}
.tile.ok .ico{background:var(--ok-soft);color:var(--ok-t)}
.tile.risk .ico{background:var(--risk-soft);color:var(--risk-t)}
.tile.risk .kv b{color:var(--risk-t)}
.tile.bad .ico{background:var(--bad-soft);color:var(--bad-t)}
.tile.bad .kv b{color:var(--bad-t)}
/* A pressed tile is a selection, so it is drawn in brand blue: the number keeps
   whatever tachograph colour it had, the frame says which set is on screen. */
button.tile{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
button.tile:hover{border-color:var(--text3)}
button.tile.on{border-color:var(--brand);background:var(--brand-soft)}
button.tile.on .kv span{color:var(--brand-d)}

.bar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.chip{height:32px;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:0 14px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--text2)}
.chip:hover{border-color:var(--text3)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}
.chip.on.s-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-t)}
.chip.on.s-risk{background:var(--risk-soft);border-color:var(--risk);color:var(--risk-t)}
.chip.on.s-violation{background:var(--bad-soft);border-color:var(--bad);color:var(--bad-t)}

/* ---------- board ---------- */
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--sh);overflow:hidden}
.grid5{display:grid;grid-template-columns:152px 120px minmax(210px,1fr) 86px 78px 62px;gap:12px;align-items:center}
.acts{display:flex;gap:4px;justify-content:flex-end}
.arrbtn.brk:hover{border-color:var(--brk);color:var(--brk);background:var(--ok-soft)}
.arrbtn.brk.on{background:var(--brk);border-color:var(--brk);color:#fff}
.trailer{display:block;font-size:10.5px;color:var(--text3);font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.trailer b{font-weight:600;color:var(--text2)}
.live{display:block;font-size:9.5px;font-weight:700;letter-spacing:.3px;margin-top:1px}
.live.run{color:var(--risk-t)} .live.soon{color:var(--bad-t)} .live.wait{color:var(--text3)}
.live.arr{color:var(--ok-t)} .live.late{color:var(--bad-t)} .live.brk{color:var(--brk)}
.arrbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--text3);display:flex;align-items:center;justify-content:center;padding:0}
.arrbtn:hover{border-color:var(--ok);color:var(--ok-t);background:var(--ok-soft)}
.arrbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.arrbtn svg{width:14px;height:14px;stroke-width:2.6}
.trow.done .thead{opacity:.62}
.badge.arr{color:var(--ok-t)}
.badge.meet{color:var(--swap)}
.badge.stops{color:var(--text3)}
.hrs small.kmrow{color:var(--text3);opacity:.85;margin-top:1px}
.swapline{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2);
  background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:4px 8px;margin-top:6px}
.swapline b{color:var(--text);font-weight:650}
.mchip{font-size:9.5px;font-weight:700;color:var(--swap);border:1px solid var(--swap);
  border-radius:4px;padding:0 4px;line-height:1.5}
.ruler{padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--panel2)}
.rlab{font-size:9.5px;letter-spacing:1.3px;font-weight:700;color:var(--text3);text-transform:uppercase}
.rlab.r{text-align:right}
.rtrack{position:relative;height:14px}
.tl-h{position:absolute;top:0;font-size:10px;color:var(--text3);font-weight:600;transform:translateX(-50%);white-space:nowrap}
.trow{border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:none}
.trow.open{background:var(--panel2)}
.thead{padding:11px 16px;cursor:pointer;border-left:3px solid transparent}
.thead:hover{background:var(--panel2)}
.trow.open .thead{border-left-color:var(--brand);background:var(--panel2)}
.tname{display:flex;align-items:center;gap:7px;min-width:0}
.tname .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.tname b{font-size:13.5px;font-weight:650;letter-spacing:-.1px;white-space:nowrap}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:0 5px;
  border:1px solid currentColor;line-height:1.6}
.badge.crew{color:var(--work)}
.badge.traffic{color:var(--risk-t)}
.badge.ramp{color:var(--work)}
.drv{font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drv i{font-style:normal;color:var(--text3)}
.hrs{font-size:12.5px;text-align:right;font-weight:600}
.hrs small{display:block;font-size:10.5px;color:var(--text3);font-weight:500}
.hrs.over{color:var(--bad-t)}
.slotv{font-size:12px;font-weight:700;text-align:right;letter-spacing:-.1px}
.slotv small{display:block;font-size:9.5px;letter-spacing:.6px;color:var(--text3);font-weight:600}

/* Timeline: every truck shares ONE scale for the day, so rows are comparable at
   a glance — a tour starting at 09:00 begins further right, and two tours that
   overlap the same ramp hour line up vertically. */
.tl{position:relative;height:26px}
.tl-grid{position:absolute;inset:0;border-radius:5px;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line2)}
.tl-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-bar{position:absolute;top:4px;bottom:4px;display:flex;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,.16)}
.seg{position:relative;min-width:0;display:flex;align-items:center;overflow:hidden}
.seg span{font-size:9.5px;font-weight:600;color:rgba(0,0,0,.6);padding:0 5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tl-slot{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:2px}
.tl-slot::after{content:"";position:absolute;top:-4px;left:-3px;border-left:4px solid transparent;
  border-right:4px solid transparent;border-top:5px solid currentColor}
.seg-veil{position:absolute;top:0;bottom:0;right:0;background:rgba(255,255,255,.62);pointer-events:none}
[data-theme="dark"] .seg-veil{background:rgba(13,18,32,.62)}
.tl-meet{position:absolute;top:-3px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
  border:2px solid var(--panel);background:var(--swap)}
.tl-now{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--brand);opacity:.75}
.tl-now::after{content:"";position:absolute;top:-4px;left:-2.2px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.tl-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text3)}

/* ---------- editor ---------- */
.editor{padding:0 16px 16px}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px}
.ehd{font-size:10px;letter-spacing:1.3px;font-weight:700;color:var(--text3);margin-bottom:10px;text-transform:uppercase}
.fields{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10.5px;letter-spacing:.9px;font-weight:600;color:var(--text3);text-transform:uppercase}
.f .field{width:118px}
.f.wide .field{width:168px}
.f.narrow .field{width:92px}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);height:var(--h-ctl);
  padding:0 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--panel);
  font-weight:500;cursor:pointer;white-space:nowrap}
.check input{width:15px;height:15px;accent-color:var(--brand);margin:0;cursor:pointer}
.check.on{border-color:var(--brand-line);background:var(--brand-soft);color:var(--brand-d)}
.dgrid{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.dbox{display:flex;flex-direction:column;gap:5px}
.dbox .dl{font-size:10.5px;letter-spacing:.8px;font-weight:700;text-transform:uppercase}
.dbox .dl.t{color:var(--risk-t)}
.dbox .dl.r{color:var(--work)}
.dbox .dr{display:flex;gap:6px;align-items:center}
.dbox .field{width:72px}
.dbox .u{font-size:11.5px;color:var(--text3);font-weight:500}
.qb{height:32px;padding:0 10px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;
  font-size:12px;font-weight:600;color:var(--text2)}
.qb:hover{border-color:var(--brand);color:var(--brand)}
.sgr{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2)}
.sgr:last-of-type{border-bottom:none}
.stag{font-size:9.5px;font-weight:700;letter-spacing:.5px;width:46px;flex:0 0 46px;text-align:center;
  border-radius:5px;padding:2px 0;color:#241A05}
.stag.light{color:#fff}
.takes{font-size:11.5px;color:var(--swap);font-weight:650;white-space:nowrap}
.slotin{width:96px;height:28px;padding:2px 6px;font-size:12px}
.arrchip{font-size:11px;font-weight:700;color:var(--ok-t);background:var(--ok-soft);
  border:1px solid var(--ok);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sgr .sl{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A leg renamed after a swap is dropped into the middle of it must not force a
   delete and a retype, so the label is edited in place — plain text until touched. */
.sgr input.sl{height:28px;border:1px solid transparent;background:transparent;border-radius:7px;
  padding:2px 6px;font-family:inherit;font-size:13px;font-weight:inherit;color:var(--text)}
.sgr input.sl:hover{border-color:var(--line2)}

.dest{width:148px;height:28px;padding:2px 6px;font-size:12px}
.kmin{width:74px;height:28px;padding:2px 6px;font-size:12px;text-align:right}
.kmv{font-size:11.5px;color:var(--text2);font-weight:650;white-space:nowrap}

.mini:hover{background:var(--line2);color:var(--text)}

.wl{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 11px;border-radius:9px;line-height:1.45}

/* ---------- drivers ---------- */
.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}

.bl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text2);margin-bottom:5px}

.dstats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}

/* Seven fixed columns, never flex-wrap: with wrapping the seventh day dropped
   onto its own full-width row and read as a separate block, not as Sunday. */
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.daychip{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;
  font-size:10px;color:var(--text3);font-weight:600;background:var(--panel2)}

/* ---------- import ---------- */
.imp{background:var(--panel);border:1px solid var(--brand-line);border-radius:var(--r-card);
  box-shadow:var(--sh);padding:16px 17px;margin-bottom:14px}

  line-height:1.75;margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);

<script>
"use strict";
const MIN=60000, MAX_TRUCKS=60, KEY="tachoplan-v2", OLDKEY="tachoplan-fleet";
const SC={ok:"var(--ok)",risk:"var(--risk)",violation:"var(--bad)"};
const SL={ok:"LEGAL",risk:"RISK",violation:"VIOLATION"};
const RANK={ok:0,risk:1,violation:2};
const TCOL={drive:"var(--drive)",drive2:"var(--drive2)",other:"var(--work)",swap:"var(--swap)",break:"var(--brk)"};
const TLAB={drive:"DRIVE",other:"WORK",swap:"SWAP","break":"BREAK"};

let state={version:2,days:{},date:todayStr(),openId:null,splitAt:null,filter:"all",view:"board",q:"",theme:"light"};

// ---------- date utils (local time, fixed weeks Mon 00:00 – Sun 24:00 per Reg 561/2006) ----------
function pad2(n){return String(n).padStart(2,"0")}
function fmtDate(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function todayStr(){return fmtDate(new Date())}
function dateFromStr(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=dateFromStr(s);d.setDate(d.getDate()+n);return fmtDate(d)}
function mondayOf(s){const d=dateFromStr(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtDate(d)}
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function dayLabel(s){const d=dateFromStr(s);return{wd:WD[(d.getDay()+6)%7],dm:pad2(d.getDate())+"."+pad2(d.getMonth()+1)}}
// Round the whole quantity first: rounding the minute remainder on its own lets it
// reach 60 and print "0h60".
function fmtHM(m){const neg=m<0;m=Math.round(Math.abs(m));return(neg?"−":"")+Math.floor(m/60)+"h"+pad2(m%60)}
function fmtClock(d){return d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
function parseTime(str,dateStr){const[h,m]=(str||"0:0").split(":").map(Number);const d=dateFromStr(dateStr||state.date);d.setHours(h||0,m||0,0,0);return d}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drvKey(name){return(name||"").trim().replace(/\s+/g," ").toLowerCase()}

// Numbering from the list length collides after a delete: remove TRK-02 of three
// and the next truck is named TRK-03, which is already on the board. Take the
// highest number actually in use instead.
function nextTruckNo(list){
  let max=0;
  for(const t of list){const m=/(\d+)\s*$/.exec(t.name||"");if(m)max=Math.max(max,+m[1])}
  return max+1;
}
function newTruck(n){return{id:uid(),name:"TRK-"+pad2(n),driver:"",driver2:"",crew:false,trailer:"",place:"",start:"06:00",slot:"",extended:false,trafficDelay:0,rampDelay:0,arrived:"",taken:[],segments:[]}}

// ---------- storage & migration ----------
function load(){
  try{const v=localStorage.getItem(KEY);
    if(v){const p=JSON.parse(v);if(p&&p.days){state.days=p.days;return}}
  }catch(e){}
  try{const old=localStorage.getItem(OLDKEY); // v1: single-day board → becomes today
    if(old){const trucks=JSON.parse(old);
      if(Array.isArray(trucks)&&trucks.length){
        trucks.forEach(t=>{t.driver2=t.driver2||"";t.crew=!!t.crew;(t.segments||[]).forEach(s=>{if(!s.who)s.who=1})});
        state.days[todayStr()]={trucks};save()}}
  }catch(e){}
}
function save(){if(state.demo)return;try{localStorage.setItem(KEY,JSON.stringify({version:2,days:state.days}))}catch(e){}}

// ---------- demo dataset (?demo URL flag — sample fleet, nothing saved) ----------
function demoData(){
  const T=todayStr();const days={};
  const seg=(type,mins,label,who)=>({type,mins,label:label||"",who:who||1});
  const swap=(mins,label,takes,meet)=>({type:"swap",mins,label,who:1,takes:takes||"",meet:meet||""});
  const dr=(mins,label,km,who)=>({type:"drive",mins,label,who:who||1,km});
  const truck=o=>({id:uid(),name:o.n,driver:o.d||"",driver2:o.d2||"",crew:!!o.d2,trailer:o.tl||"",
    start:o.s,slot:o.sl||"",extended:!!o.x,trafficDelay:o.td||0,rampDelay:o.rd||0,arrived:"",segments:o.g});
  const wd=(dateFromStr(T).getDay()+6)%7;
  const M=n=>addDays(T,-wd+n); // n=0 → this week's Monday; negative → previous week
  // previous week Mon–Sat (Sunday off → weekly rest gap)
  for(let i=0;i<6;i++){const list=[{n:"TRK-01",d:"Ivan Petrov",s:"05:30",g:[seg("drive",420,"Tour")]}];
    if(i<5){list.push({n:"TRK-04",d:"Karl Weber",s:"05:00",g:[seg("drive",480,"Tour")]},
            {n:"TRK-03",d:"Mihai Rusu",s:"06:00",g:[seg("drive",480,"Tour")]})}
    days[M(i-7)]={trucks:list.map(truck)}}
  // this week up to yesterday
  const ivan=[600,540,600,540],karl=[600,600,480,510];
  const mihai=[{m:540,s:"06:00"},{m:540,s:"06:00"},{m:570,s:"06:00"},{m:540,s:"11:00"}];
  for(let i=0;i<wd&&i<4;i++){days[M(i)]={trucks:[
    {n:"TRK-01",d:"Ivan Petrov",s:"05:30",x:ivan[i]>540,g:[seg("drive",ivan[i],"Tour")]},
    {n:"TRK-04",d:"Karl Weber",s:"05:00",x:karl[i]>540,g:[seg("drive",karl[i],"Tour")]},
    {n:"TRK-03",d:"Mihai Rusu",s:mihai[i].s,x:mihai[i].m>540,g:[seg("drive",mihai[i].m,"Tour")]}].map(truck)}}
  // today's board
  // TRK-05 and TRK-08 are a meet pair: they drive towards each other, exchange
  // trailers at the same yard (code M1) and both turn back inside their hours.
  days[T]={trucks:[
    {n:"TRK-01",d:"Ivan Petrov",tl:"TR-4471",s:"05:30",sl:"16:30",g:[dr(270,"To FC DTM2",310),
      Object.assign(swap(30,"Drop & hook DTM2","TR-8890"),{slot:"10:15"}),dr(225,"To FC CGN1",260)]},
    {n:"TRK-02",d:"Ana Pop",d2:"Boris Ionescu",tl:"TR-2210",s:"06:00",sl:"20:00",g:[dr(240,"To FC LEJ1",275),dr(240,"LEJ1 → POZ1",275,2),swap(45,"Drop & hook POZ1","TR-3115"),dr(120,"Return leg",140)]},
    {n:"TRK-03",d:"Mihai Rusu",tl:"TR-7702",s:"07:15",x:1,g:[dr(300,"To FC WRO2",345),seg("break",15,"Split part 1"),dr(270,"Return via POZ1",310)]},
    {n:"TRK-04",d:"Karl Weber",tl:"TR-5540",s:"04:45",sl:"12:10",td:40,g:[dr(150,"To FC HAM2",170),
      Object.assign(swap(40,"Drop & hook HAM2","TR-1288"),{slot:"07:30"}),dr(180,"To FC BER3",205)]},
    {n:"TRK-05",d:"Piotr Nowak",tl:"TR-6633",s:"06:30",sl:"14:40",g:[dr(190,"To meet point A2",220),swap(40,"Meet A2 Bad Oeynhausen","TR-9004","M1"),dr(200,"To FC SZZ1",230)]},
    {n:"TRK-06",d:"Jonas Berg",tl:"TR-8471",s:"05:00",g:[dr(330,"To FC DUS2",380),seg("other",30,"Ramp DUS2"),dr(240,"To FC FRA7",275)]},
    {n:"TRK-07",d:"Luca Moretti",tl:"TR-3390",s:"08:00",sl:"19:00",rd:30,g:[dr(240,"To FC MXP5",275),swap(25,"Drop & hook MXP5","TR-4820"),dr(210,"To FC BLQ1",240)]},
    {n:"TRK-08",d:"Tomas Novak",tl:"TR-9004",s:"07:00",sl:"17:30",g:[dr(150,"To meet point A2",170),swap(40,"Meet A2 Bad Oeynhausen","TR-6633","M1"),dr(220,"To FC PRG2",255)]}
  ].map(truck)};
  // Tours whose planned end is already behind the clock are shown ticked off, so
  // the demo looks like a board mid-shift whatever hour it is opened at.
  const now=new Date();
  days[T].trucks.forEach((t,i)=>{const sim=simulate(t,T);
    if(!(sim.events.length&&sim.end<now))return;
    // A finished tour was ticked off point by point through the day.
    (sim.stops||[]).forEach(st=>{t.segments[st.i].arrived=fmtClock(new Date(+st.at+(2+i%5)*MIN))});
    t.arrived=fmtClock(new Date(sim.end.getTime()+(3+i%4)*MIN))});
  // One truck is on a reported break right now, so the countdown is visible at any
  // hour the demo is opened; another stopped early, which costs it a second break.
  const live=days[T].trucks.find(t=>{if(t.arrived)return false;const s=simulate(t,T);
    return s.events.length&&now>=s.start&&now<s.end});
  if(live)live.taken=[{at:fmtClock(new Date(now.getTime()-52*MIN)),mins:45,open:true}];
  const early=days[T].trucks.find(t=>t.name==="TRK-03");
  if(early&&early!==live)early.taken=[{at:"11:15",mins:45}];
  return days;
}
function curTrucks(){return(state.days[state.date]||{trucks:[]}).trucks}
function ensureDay(){if(!state.days[state.date])state.days[state.date]={trucks:[]}}
function prevDayWithData(){return Object.keys(state.days).filter(d=>d<state.date&&(state.days[d].trucks||[]).length).sort().pop()||null}
function pruneEmptyDays(){for(const d of Object.keys(state.days))if(!(state.days[d].trucks||[]).length)delete state.days[d]}

// ---------- tour simulation (one truck, one day) ----------
// Models: 4h30 continuous driving → 45m break, or split 15m + ≥30m (in that order);
// daily driving 9h / 10h extended; solo span 13h/15h; crew (multi-manning) span 21h
// within the 30h window incl. 9h rest; ≥45m contiguous passenger time while the
// co-driver drives counts as a break (Art. 7).
function simulate(tr,dateStr){
  dateStr=dateStr||state.date;
  const crew=!!tr.crew;
  const start=parseTime(tr.start,dateStr);
  const driveLimit=(tr.extended?10:9)*60;
  const events=[],warnings=[];
  let t=new Date(start),totalBreak=0;
  const D={1:{drive:0,since:0,armed:false,pass:0},2:{drive:0,since:0,armed:false,pass:0}};
  const push=(type,label,mins,who)=>{events.push({type,label,mins,who:who||0,start:new Date(t),end:new Date(t.getTime()+mins*MIN)});t=new Date(t.getTime()+mins*MIN)};
  const restAll=mins=>{for(const w of[1,2]){const dr=D[w];
    if(mins>=45){dr.since=0;dr.armed=false;dr.pass=0}
    else if(mins>=30&&dr.armed){dr.since=0;dr.armed=false;dr.pass=0}
    else if(mins>=15&&!dr.armed)dr.armed=true}};
  const autoBreak=w=>{const need=D[w].armed?30:45;
    push("break","Break "+need+"m"+(D[w].armed?" (2nd part)":"")+(crew?" D"+w:""),need);
    totalBreak+=need;restAll(need)};
  // ---------- breaks the driver actually took ----------
  // The 4h30 rule says a break must come no LATER than that, not exactly then, and
  // drivers routinely stop earlier — at a services they like, or because the queue
  // is short. Such a break is pinned to a real clock time, so it cuts whatever the
  // plan had at that moment and resets the counter there. The plan bends to reality
  // instead of reality being assumed away.
  // Times are read against the board's date, so a night tour reporting a break at
  // 00:30 has to be understood as the next day — the same rollover the slot gets.
  const reported=(tr.taken||[]).filter(b=>b&&b.at&&+b.mins>0)
    .map(b=>{let at=parseTime(b.at,dateStr);
      if(start-at>12*60*MIN)at=new Date(at.getTime()+24*60*MIN);
      let mins=Math.max(1,Math.round(+b.mins));
      // While the driver is still standing, 45 minutes is only the minimum he owes —
      // the real break is however long he has been there, and the tour has to be
      // built on that, not on the assumption that he left on the dot.
      if(b.open&&dateStr===todayStr()){
        const stood=(Date.now()-at)/MIN;
        if(stood>mins)mins=Math.round(stood)}
      return{at,mins,open:!!b.open}})
    .sort((a,b)=>a.at-b.at);
  let ri=0,art7=false,earlyStop=false;
  const pending=()=>ri<reported.length;
  const dueNow=()=>pending()&&reported[ri].at<=t;
  // minutes from now until the next reported break, if it falls inside this stretch
  const cutIn=span=>{if(!pending())return -1;
    const d=(reported[ri].at-t)/MIN;return(d>0&&d<span)?d:-1};
  // Is the driver's real stop close enough to belong to the stretch being driven?
  // If it is, the plan must not invent a break before it; if it is hours away, the
  // report is stale data and the plan carries on predicting normally.
  const realSoon=rem=>pending()&&(reported[ri].at-t)/MIN<=rem;

  // atEnd marks a break flushed after the tour is over: at that point the counter
  // is naturally below 4h30, so it must not be mistaken for stopping early.
  const takeReported=(who,atEnd)=>{const b=reported[ri++];
    const w=crew?(who||1):1;
    // If the plan is already standing still where the driver says he stopped, that
    // is the same rest seen twice — count it once.
    const last=events[events.length-1];
    if(last&&last.type==="break"&&!last.reported&&b.at<last.end&&last.mins>=b.mins){
      last.reported=true;return}
    if(b.at<start)warnings.push("break reported at "+fmtClock(b.at)+" is before the tour starts — check the time");
    else if(b.at>t)warnings.push("break reported at "+fmtClock(b.at)+" is later than the plan reaches — the plan is behind reality");
    // The counter is reset by the break actually taken, so if the driver was still
    // rolling past 4h30 when he stopped, that is an Art. 7 over-run. Catching it is
    // the whole reason this tool listens to what happened instead of what was planned.
    const drove=D[w].since;
    if(!atEnd&&drove<270&&b.mins>=15)earlyStop=true;
    if(drove>270){art7=true;
      warnings.push("drove "+fmtHM(drove)+" straight before the break reported at "+fmtClock(b.at)+" — over the 4h30 limit (Art. 7)")}
    push("break","Break "+b.mins+"m ("+(b.open?"standing":"reported")+")",b.mins);
    events[events.length-1].reported=true;
    events[events.length-1].open=!!b.open;
    if(b.open&&b.mins>=180)warnings.push("break has been open for "+fmtHM(b.mins)+" — tap again when the driver rolls, or correct the time");
    totalBreak+=b.mins;restAll(b.mins);
    if(b.mins<15)warnings.push("reported break "+b.mins+"m is under the 15-minute minimum — it does not count towards the 4h30");
  };

  const doDrive=(label,mins,who)=>{who=crew?(who||1):1;let rem=mins;
    while(rem>0){
      if(dueNow()){takeReported(who);continue}
      const dr=D[who];
      // A reported stop that belongs to this stretch outranks the planned one: the
      // break happens where the driver took it, not where the schedule wanted it.
      const soon=realSoon(rem);
      if(!soon&&270-dr.since<=0){autoBreak(who);continue}
      let chunk=soon?rem:Math.min(rem,270-dr.since);
      const cut=cutIn(chunk);if(cut>0)chunk=cut;
      push(who===2?"drive2":"drive",label,chunk,who);
      dr.drive+=chunk;dr.since+=chunk;dr.pass=0;rem-=chunk;
      if(crew){const o=who===1?2:1;D[o].pass+=chunk; // passenger in moving vehicle
        if(D[o].pass>=45||(D[o].armed&&D[o].pass>=30)){D[o].since=0;D[o].armed=false;D[o].pass=0}}
    }};

  const doOther=(type,label,mins,meta,segIndex)=>{let rem=mins;
    while(rem>0){
      if(dueNow()){takeReported();continue}
      let chunk=rem;const cut=cutIn(chunk);if(cut>0)chunk=cut;
      push(type,label,chunk);
      // Every piece keeps the swap's identity: a break in the middle of a swap must
      // not shorten the window the partner truck is checked against.
      if(meta)Object.assign(events[events.length-1],meta);
      if(segIndex!==undefined)events[events.length-1].segIndex=segIndex;
      rem-=chunk;D[1].pass=0;D[2].pass=0}};

  // ---------- live delays ----------
  // A delay is reported while the tour is running, so it belongs where the truck
  // actually is, not at the end of the day: a quarter of an hour lost on the road
  // before a swap has to make that swap a quarter of an hour late, or the slot is
  // measured against a time nobody is going to keep. What the truck has already
  // done is what has been stamped, so the delay goes in after the last stop stamped
  // as arrived and pushes every stop still ahead of it. Nothing stamped means the
  // truck has not reached its first point yet; a tour stamped to the end has taken
  // the delay already, and there it stays the tail it always was.
  let delayAt=tr.arrived?tr.segments.length:0;
  if(!tr.arrived)tr.segments.forEach((seg,i)=>{
    if((seg.type==="other"||seg.type==="swap")&&seg.arrived)delayAt=i+1});
  const liveDelays=()=>{
    if(tr.trafficDelay>0)doDrive("⚠ Traffic",tr.trafficDelay,1);
    if(tr.rampDelay>0)doOther("other","⚠ Ramp queue",tr.rampDelay,null)};

  tr.segments.forEach((seg,segIndex)=>{
    while(dueNow())takeReported();
    if(segIndex===delayAt)liveDelays();
    if(seg.type==="drive")doDrive(seg.label||"Drive",seg.mins,seg.who);
    else if(seg.type==="break"){push("break",seg.label||"Break",seg.mins);totalBreak+=seg.mins;restAll(seg.mins)}
    else{
      // A trailer swap is OTHER WORK as far as the regulation is concerned; what
      // makes it different is what it does to the fleet — the truck leaves with a
      // different trailer, and at a meet point a second truck has to be there too.
      const isSwap=seg.type==="swap";
      doOther(isSwap?"swap":"other",seg.label||(isSwap?"Trailer swap":"Work"),seg.mins,
        isSwap?{takes:(seg.takes||"").trim(),meet:(seg.meet||"").trim()}:null,segIndex);
    }
  });
  while(dueNow())takeReported();
  if(delayAt>=tr.segments.length)liveDelays();
  while(ri<reported.length)takeReported(1,true);

  // Stopping early is always legal, but it is not always free: break at 4h00 and
  // the stretch still to drive may pass 4h30, which forces a second break the plan
  // never had. That is the number a dispatcher needs before promising a slot.
  if(reported.length){
    const asPlanned=simulate({...tr,taken:[]},dateStr);
    const cost=(t-start)/MIN-asPlanned.span;
    // Whether this cost a whole extra break is answered by the break MINUTES, not
    // by counting break events: a 10-minute stop that does not qualify adds an
    // event without adding a break, while stopping at 4h00 adds a real 45 minutes.
    const moreBreak=totalBreak-asPlanned.totalBreak;
    if(cost>=1)warnings.push((earlyStop?"stopping early costs ":"the reported break adds ")+fmtHM(cost)+
      (earlyStop?" against the plan":" to the plan")+
      (moreBreak>=30?" — the tour now needs a second full break":
       moreBreak>0?" — the stop was too short to count, so it is simply lost time":""));
  }

  let status="ok";
  const lift=s=>{if(RANK[s]>RANK[status])status=s};
  const esc0=v=>String(v||"").trim();
  if(art7)lift("violation");
  const active=crew?[1,2]:[1];
  for(const w of active){const dr=D[w],tag=crew?"D"+w+" ":"";
    if(dr.drive>driveLimit){lift("violation");warnings.push(tag+"driving "+fmtHM(dr.drive)+" > limit "+fmtHM(driveLimit)+(tr.trafficDelay&&w===1?" (incl. traffic)":""))}
    else if(driveLimit-dr.drive<30&&dr.drive>0){lift("risk");warnings.push(tag+"only "+fmtHM(driveLimit-dr.drive)+" driving reserve")}}
  const span=(t-start)/MIN;
  if(crew){
    if(span>21*60){lift("violation");warnings.push("Crew span "+fmtHM(span)+" > 21h (30h window − 9h rest)")}
    else if(span>19*60){lift("risk");warnings.push("Crew span "+fmtHM(span)+" — approaching 21h window")}
  }else{
    if(span>15*60){lift("violation");warnings.push("Shift span "+fmtHM(span)+" > 15h max")}
    else if(span>13*60){lift("risk");warnings.push("Span "+fmtHM(span)+" → reduced daily rest (9h) required")}
  }
  // A tour is a chain of places, not one destination: the swap at the first FC has
  // its own booked time, and missing it matters exactly as much as missing the last.
  const stops=[];
  tr.segments.forEach((seg,i)=>{
    if(seg.type!=="other"&&seg.type!=="swap")return;
    const first=events.find(e=>e.segIndex===i);
    if(!first)return;
    const st={i,label:seg.label||(seg.type==="swap"?"Trailer swap":"Stop"),at:first.start,
      slot:seg.slot||"",arrived:seg.arrived||"",diff:null};
    if(st.slot){let sl=parseTime(st.slot,dateStr);
      if(sl<start)sl=new Date(sl.getTime()+24*60*MIN);
      st.slotAt=sl;
      st.diff=(sl-(st.arrived?parseTime(st.arrived,dateStr):first.start))/MIN;
      if(st.diff<0){lift("violation");
        warnings.push((st.arrived?"arrived at ":"misses the slot at ")+esc0(st.label)+
          (st.arrived?" "+fmtHM(-st.diff)+" late":" by "+fmtHM(-st.diff)))}
      else if(st.diff<20)lift("risk"),warnings.push("only "+fmtHM(st.diff)+" of slot buffer at "+esc0(st.label))}
    stops.push(st)});

  let slotInfo=null;
  if(tr.slot){let slot=parseTime(tr.slot,dateStr);if(slot<start)slot=new Date(slot.getTime()+24*60*MIN);
    const diff=(slot-t)/MIN;slotInfo={slot,diff};
    if(diff<0){lift("violation");warnings.push("Misses slot by "+fmtHM(-diff)+(tr.trafficDelay||tr.rampDelay?" — consider Amazon dispute/notification":""))}
    else if(diff<20&&status==="ok"){lift("risk");warnings.push("Slot buffer only "+fmtHM(diff))}}
  const totalDrive=D[1].drive+D[2].drive;
  return{events,start,end:t,totalDrive,d1:D[1].drive,d2:D[2].drive,totalBreak,driveLimit,span,warnings,status,slotInfo,stops,crew};
}

// ---------- fleet-wide sims & per-driver weekly analytics ----------
function simAll(){const out={};for(const d of Object.keys(state.days))
  out[d]=(state.days[d].trucks||[]).map(tr=>({tr,sim:simulate(tr,d)}));return out}

// Rest gap classification between duty days:
// <9h violation · 9–11h reduced daily rest (max 3 between weekly rests) · ≥24h weekly rest
// (24–45h reduced → compensation due en bloc by end of 3rd following week; two consecutive
// reduced weekly rests flagged per Art. 8(6); >6×24h since last weekly rest → overdue).
function analyzeDrivers(sims){
  const map={};
  for(const date of Object.keys(sims)){
    for(const{tr,sim}of sims[date]){
      const roles=[[1,tr.driver,sim.d1]];if(tr.crew)roles.push([2,tr.driver2,sim.d2]);
      for(const[,name,drive]of roles){const k=drvKey(name);if(!k)continue;
        const rec=map[k]||(map[k]={name:name.trim(),days:{}});
        const dd=rec.days[date]||(rec.days[date]={drive:0,start:sim.start,end:sim.end,trucks:[]});
        dd.drive+=drive;dd.trucks.push(tr.name);
        if(sim.start<dd.start)dd.start=sim.start;
        if(sim.end>dd.end)dd.end=sim.end}}}
  for(const k of Object.keys(map)){
    const r=map[k];r.issues=[];
    const dates=Object.keys(r.days).sort();r.dates=dates;
    // fixed-week aggregates
    r.weeks={};
    for(const d of dates){const wk=mondayOf(d);const w=r.weeks[wk]||(r.weeks[wk]={drive:0,ext:[]});
      w.drive+=r.days[d].drive;if(r.days[d].drive>9*60)w.ext.push(d)}
    for(const wk of Object.keys(r.weeks)){const w=r.weeks[wk];
      if(w.drive>56*60)r.issues.push({level:"violation",week:wk,msg:"weekly driving "+fmtHM(w.drive)+" > 56h (week "+dayLabel(wk).dm+")"});
      const prev=r.weeks[addDays(wk,-7)];
      if(prev&&prev.drive+w.drive>90*60)r.issues.push({level:"violation",week:wk,msg:"two-week driving "+fmtHM(prev.drive+w.drive)+" > 90h"});
      if(w.ext.length>2)r.issues.push({level:"violation",week:wk,msg:w.ext.length+"× extended (>9h) days in week "+dayLabel(wk).dm+" — max 2"})}
    // rest analysis over consecutive duty days
    r.rests=[];let reduced=0;r.comp=[];let lastWeeklyEnd=null;let prevWeeklyReduced=false;
    for(let i=1;i<dates.length;i++){
      const a=r.days[dates[i-1]],b=r.days[dates[i]];
      const gap=(b.start-a.end)/MIN;const gh=gap/60;
      const lbl=dayLabel(dates[i-1]).dm+"→"+dayLabel(dates[i]).dm;
      if(gap<0){r.issues.push({level:"violation",msg:"overlapping duty "+lbl+" (tour ends after next start)"})}
      else if(gh<9){r.issues.push({level:"violation",msg:"rest "+fmtHM(gap)+" ("+lbl+") < 9h minimum"})}
      else if(gh<11){reduced++;r.rests.push({t:"reduced",gap,lbl});
        if(reduced>3)r.issues.push({level:"violation",msg:reduced+"× reduced daily rests since last weekly rest — max 3"});}
      else if(gh<24){r.rests.push({t:"daily",gap,lbl})}
      else{ // weekly rest
        const red=gh<45;
        r.rests.push({t:red?"weekly-reduced":"weekly",gap,lbl});
        if(red){const owe=45*60-gap;const due=addDays(mondayOf(dates[i]),27);
          r.comp.push({owe,due,lbl});
          if(prevWeeklyReduced)r.issues.push({level:"risk",msg:"two consecutive reduced weekly rests ("+lbl+") — Art. 8(6): one must be regular 45h"});
          prevWeeklyReduced=true}
        else prevWeeklyReduced=false;
        reduced=0;lastWeeklyEnd=b.start}}
    // weekly rest overdue: >6 daily driving periods since last weekly rest (within data)
    if(dates.length){
      const anchor=lastWeeklyEnd||r.days[dates[0]].start;
      const lastEnd=r.days[dates[dates.length-1]].end;
      const spanH=(lastEnd-anchor)/MIN/60;
      if(spanH>6*24)r.issues.push({level:"violation",msg:"no weekly rest for "+Math.floor(spanH/24)+" days — due after 6×24h"})}
  }
  return map;
}
// issues relevant for the viewed date's board (current fixed week + undated rest issues)
function issuesFor(drv,k){const r=drv[drvKey(k)];if(!r)return[];
  const wk=mondayOf(state.date);
  return r.issues.filter(i=>!i.week||i.week===wk)}

// ---------- live board ----------
// The board is a dispatch desk, not a plan on paper: during a shift the question
// is not "was this tour legal" but "who is driving right now, and who is twenty
// minutes from the ramp". Everything below is computed against the clock and
// only shown for the day actually being lived — other dates stay planning views.
function liveOf(tr,s,now){
  if(!s.events.length)return{phase:"none"};
  if(tr.arrived)return{phase:"arrived",at:tr.arrived,against:s.slotInfo?"slot":"plan",
    delta:((s.slotInfo?s.slotInfo.slot:s.end)-parseTime(tr.arrived))/MIN};
  if(now<s.start)return{phase:"before",inMin:(s.start-now)/MIN};
  if(now>=s.end)return{phase:"overdue",lateMin:(now-s.end)/MIN};
  const ev=s.events.find(e=>now>=e.start&&now<e.end)||null;
  return{phase:"running",ev,onBreak:!!(ev&&ev.type==="break"),
    breakLeft:ev&&ev.type==="break"?(ev.end-now)/MIN:0,reported:!!(ev&&ev.reported),
    etaMin:(s.end-now)/MIN,donePct:(now-s.start)/(s.end-s.start)*100};
}

// A meet point is the one place where two tours depend on each other: both trucks
// have to stand in the same yard at the same time or the trailers cannot change
// hands. Trucks are partners when their swap segments carry the same meet code.
function analyzeMeets(rows){
  const by={};
  rows.forEach(r=>r.sim.events.forEach(e=>{
    if(!(e.type==="swap"&&e.meet))return;
    const code=String(e.meet).toUpperCase();   // a backup may hold it in any case
    const list=by[code]=by[code]||[];
    // A reported break can cut a swap in two; both halves are the same truck
    // standing in the same yard, so they describe one window, not two arrivals.
    const same=list.find(p=>p.id===r.tr.id);
    if(same){if(e.start<same.start)same.start=e.start;if(e.end>same.end)same.end=e.end}
    else list.push({truck:r.tr.name,id:r.tr.id,start:e.start,end:e.end,label:e.label})}));
  const out={};
  for(const code of Object.keys(by)){
    const parts=by[code].sort((a,b)=>a.start-b.start);
    const lastIn=parts[parts.length-1].start;
    const firstOut=parts.reduce((m,p)=>p.end<m?p.end:m,parts[0].end);
    out[code]={code,parts,solo:parts.length<2,overlapMin:(firstOut-lastIn)/MIN,
      waits:parts.map(p=>({id:p.id,truck:p.truck,waitMin:(lastIn-p.start)/MIN}))};
  }
  return out;
}
function meetIssues(tr,meets){
  const out=[];
  for(const code of Object.keys(meets)){
    const m=meets[code];const mine=m.parts.find(p=>p.id===tr.id);if(!mine)continue;
    if(m.solo){out.push({level:"risk",msg:"meet "+code+" has no partner truck on this board"});continue}
    const others=m.parts.filter(p=>p.id!==tr.id).map(p=>p.truck).join(", ");
    if(m.overlapMin<=0){out.push({level:"violation",
      msg:"meet "+code+": no overlap with "+others+" — trailers cannot change hands"})}
    else{const w=m.waits.find(w=>w.id===tr.id);
      if(w&&w.waitMin>=20)out.push({level:"risk",
        msg:"meet "+code+": waits "+fmtHM(w.waitMin)+" for "+others})}
  }
  return out;
}
// What the truck is pulling, start to finish: the swaps rewrite it along the way.
// The row's pause button and its undo have to agree on one definition of "a break
// is running right now", or the button lights while clicking it adds a second one.
// It is only ever true on today's board — on any other date there is no "now".
function runningBreakIndex(tr){
  if(state.date!==todayStr())return -1;
  const now=new Date();
  return (tr.taken||[]).findIndex(b=>b.open&&now>=parseTime(b.at,state.date));
}
// A tour is walked point by point: each place it stands, then the end of the tour.
// The dispatcher ticks them off one call at a time, so the board has to know which
// one is next rather than treating the whole tour as a single arrival.
function tourStops(tr,s){
  const list=(s.stops||[]).map(st=>({...st,kind:"seg"}));
  list.push({kind:"end",label:"End of tour",at:s.end,slot:tr.slot||"",arrived:tr.arrived||"",
    diff:s.slotInfo?s.slotInfo.diff:null,slotAt:s.slotInfo?s.slotInfo.slot:null});
  return list;
}
function nextStopIndex(list){return list.findIndex(x=>!x.arrived)}

// How long the driver has actually been standing, for an open break.
function stoodFor(tr){
  const i=runningBreakIndex(tr);if(i<0)return null;
  const b=tr.taken[i];if(!b.open)return null;
  return Math.max(0,(new Date()-parseTime(b.at,state.date))/MIN);
}
// Kilometres ride with the driving, so only drive legs carry them. The engine
// never reads them — a wrong distance must not be able to move a verdict, and a
// board saved before this field existed simply totals zero.
function legKm(tr,a,b){const sg=tr.segments||[];let k=0;
  for(let i=Math.max(0,a);i<Math.min(b,sg.length);i++)if(sg[i].type==="drive")k+=+sg[i].km||0;
  return k}
function tourKm(tr){return legKm(tr,0,(tr.segments||[]).length)}
// How far it still is to the point the dispatcher is waiting on: the legs between
// the last place ticked off and the next one, not the whole tour.
function kmToNext(tr,list,ni){
  if(ni<0||!list[ni])return 0;
  const to=list[ni].kind==="end"?(tr.segments||[]).length:list[ni].i;
  let from=0;
  for(let k=ni-1;k>=0;k--)if(list[k].kind==="seg"){from=list[k].i+1;break}
  return legKm(tr,from,to)}
// One driving leg becomes two with a stop between them: the driver stands
// part-way, changes trailer and drives on. Callers guarantee 0 < after < sg.mins,
// because a cut that leaves no driving on one side is not a cut, it is an append.
function splitLeg(sg,after,mid){
  const first={...sg,mins:after}, second={...sg,mins:sg.mins-after};
  // Kilometres ride with the driving, so they split where the minutes do.
  const km=+sg.km||0;
  if(km){first.km=Math.round(km*after/sg.mins);second.km=km-first.km}
  // Neither half is the route the map measured any more, so its figures go rather
  // than being carried onto two legs neither of them describes.
  [first,second].forEach(h=>{delete h.mapMin;delete h.mapAt;delete h.autoMin});
  // The original label names where the leg was going and the second half still goes
  // there; the first half now ends at the new stop and is renamed for it, so one
  // run does not read as two to the same place.
  if(mid.label){first.label=/^to /i.test(mid.label)?mid.label:"To "+mid.label;first.to=mid.label}
  return[first,mid,second]}

// What the tool reckons a driving leg takes. Two floors, and the slower wins: a
// lorry is never quicker than the car Google routed, so on an open motorway its
// own limit decides, and in a jam the map's figure already does. Replacing one
// with the other outright would invent time back on a congested leg — the exact
// flattery this board exists to prevent.
// Either half may be missing: no measurement, or no fleet speed set.
function planMin(sg,kmh){
  const car=Math.max(0,Math.round(+sg.mapMin||0));
  const km=+sg.km||0;
  const bySpeed=(kmh>0&&km>0)?Math.round(km/kmh*60):0;
  return Math.max(car,bySpeed);
}

// The chain of places the tour visits: the yard it leaves from, then wherever
// each driving leg ends. A swap or an unload happens where the truck already is,
// so only drive legs name a place.
function placeChain(tr){
  const chain=[(tr.place||"").trim()];
  (tr.segments||[]).forEach(sg=>{if(sg.type==="drive")chain.push((sg.to||"").trim())});
  return chain}
function trailerChain(tr,s){
  const chain=[tr.trailer||""];
  s.events.forEach(e=>{if(e.type==="swap"&&e.takes)chain.push(e.takes)});
  return chain.filter(Boolean);
}

// ---------- CSV import / export ----------
// Columns (any order, case-insensitive):
//   truck;driver;driver2;crew;trailer;from;date;start;slot;extended;arrived;breaks;segments
// segments = "type:minutes:label|type:minutes:label|…"
//   type: drive · drive2 (crew D2) · other/work · swap · break
//   a swap may carry "#TRAILER" (the trailer taken) and "@CODE" (meet point), a drive
//   may carry "~KM" (distance) and ">PLACE" (where it ends), and any stop may carry
//   "!HH:MM" (its booked slot) and "=HH:MM" (when it was reached), e.g.
//   swap:45:Meet A2 Bad Oeynhausen #TR-8890 @M1 !09:30 =09:41
//   drive:3h10:To meet point A2 ~220 >Bad Oeynhausen, DE
// from = where the tour starts, the first place a measured distance runs from
// breaks = clock:minutes pairs for breaks the driver actually took, e.g. 11:15:45|15:40:30
// minutes accepts 300 · 5h · 5h30 · 5:30 · 330m.  Delimiter auto-detected: ; or , or TAB (Excel paste).
function toMins(v){v=String(v||"").trim().toLowerCase();if(!v)return NaN;
  let m=v.match(/^(\d+)h(\d{1,2})?$/);if(m)return +m[1]*60+(+m[2]||0);
  m=v.match(/^(\d+):(\d{1,2})$/);if(m)return +m[1]*60+(+m[2]||0);
  m=v.match(/^(\d+)m?$/);if(m)return +m[1];return NaN}
function boolVal(v){return/^(1|y|yes|true|x)$/i.test(String(v||"").trim())}
function splitLine(line,delim){const out=[];let cur="",q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;

function parseSegments(str,errs,ln){const segs=[];
  for(const part of String(str||"").split("|").map(s=>s.trim()).filter(Boolean)){
    const bits=part.split(":");const type0=(bits[0]||"").trim().toLowerCase();
    const mins=toMins(bits[1]);const label=bits.slice(2).join(":").trim();
    const map={drive:["drive",1],drive1:["drive",1],drive2:["drive",2],other:["other",1],work:["other",1],
      swap:["swap",1],"break":["break",1],rest:["break",1]};
    if(!map[type0]){errs.push("line "+ln+": unknown segment type '"+type0+"'");continue}
    if(!(mins>0)){errs.push("line "+ln+": bad minutes in '"+part+"'");continue}
    const seg={type:map[type0][0],mins,label,who:map[type0][1]};
    if(seg.type==="other"||seg.type==="swap"){
      const sl=seg.label.match(/!(\d{1,2}:\d{2})/);
      if(sl){seg.slot=sl[1];seg.label=seg.label.replace(sl[0],"")}
      const ar=seg.label.match(/=(\d{1,2}:\d{2})/);
      if(ar){seg.arrived=ar[1];seg.label=seg.label.replace(ar[0],"")}
      seg.label=seg.label.replace(/\s+/g," ").trim()}
    if(seg.type==="swap"){
      const mt=seg.label.match(/@([A-Za-z0-9_-]+)/);
      if(mt){seg.meet=mt[1].toUpperCase();seg.label=seg.label.replace(mt[0],"")}
      const tk=seg.label.match(/#([^\s#@]+)/);
      if(tk){seg.takes=tk[1];seg.label=seg.label.replace(tk[0],"")}
      seg.label=seg.label.replace(/\s+/g," ").trim()}
    if(seg.type==="drive"){
      // Both markers must start a word. ">" and "~" turn up in ordinary labels far
      // more readily than "#" or "@" do, and "Base > FC" is a name, not a place.
      const km=seg.label.match(/(?:^|\s)~(\d+)\b/);
      if(km){seg.km=+km[1];seg.label=seg.label.replace(km[0],"")}
      // A place name then runs to the next marker or the end of the label, because
      // a town is written "Bad Oeynhausen, DE" and must survive its own spaces.
      const to=seg.label.match(/(?:^|\s)>([^#@!=~]+)/);
      if(to){seg.to=to[1].trim();seg.label=seg.label.replace(to[0],"")}
      seg.label=seg.label.replace(/\s+/g," ").trim()}
    segs.push(seg)}
  return segs}
function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length)return{rows:[],errors:["no data"]};
  const counts=[["\t",(lines[0].match(/\t/g)||[]).length],[";",(lines[0].match(/;/g)||[]).length],[",",(lines[0].match(/,/g)||[]).length]];
  counts.sort((a,b)=>b[1]-a[1]);const delim=counts[0][1]>0?counts[0][0]:";";
  const head=splitLine(lines[0],delim).map(h=>h.trim().toLowerCase());
  const idx=n=>head.indexOf(n);
  if(idx("truck")<0||idx("segments")<0)return{rows:[],errors:["header must contain at least: truck, segments (got: "+head.join(", ")+")"]};
  const rows=[],errors=[];
  for(let i=1;i<lines.length;i++){
    const f=splitLine(lines[i],delim);const g=n=>{const j=idx(n);return j<0?"":String(f[j]||"").trim()};
    const ln=i+1;
    const date=g("date");
    if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){errors.push("line "+ln+": date must be YYYY-MM-DD, got '"+date+"'");continue}
    const start=g("start")||"06:00";
    if(!/^\d{1,2}:\d{2}$/.test(start)){errors.push("line "+ln+": bad start '"+start+"'");continue}
    const slot=g("slot");
    if(slot&&!/^\d{1,2}:\d{2}$/.test(slot)){errors.push("line "+ln+": bad slot '"+slot+"'");continue}
    const taken=[];
    for(const part of g("breaks").split("|").map(x=>x.trim()).filter(Boolean)){
      const m=/^(\d{1,2}:\d{2}):(\d+)(\+?)$/.exec(part);
      if(!m){errors.push("line "+ln+": bad break '"+part+"', expected HH:MM:minutes");continue}
      taken.push({at:m[1],mins:+m[2],open:m[3]==="+"})}
    const arrived=g("arrived");
    if(arrived&&!/^\d{1,2}:\d{2}$/.test(arrived)){errors.push("line "+ln+": bad arrived time '"+arrived+"'");continue}
    rows.push({name:g("truck")||"TRK",driver:g("driver"),driver2:g("driver2"),crew:boolVal(g("crew"))||!!g("driver2"),
      trailer:g("trailer"),place:g("from"),date:date||state.date,start,slot,extended:boolVal(g("extended")),arrived,taken,
      segments:parseSegments(g("segments"),errors,ln)})}
  return{rows,errors}}
function applyImport(rows,mode){
  const byDate={};rows.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r)});
  let added=0,skipped=0;
  for(const d of Object.keys(byDate)){
    if(mode==="replace")state.days[d]={trucks:[]};
    if(!state.days[d])state.days[d]={trucks:[]};
    const list=state.days[d].trucks;
    for(const r of byDate[d]){
      if(list.length>=MAX_TRUCKS){skipped++;continue}
      list.push({id:uid(),name:r.name,driver:r.driver,driver2:r.driver2,crew:r.crew,trailer:r.trailer,
        place:r.place||"",start:r.start,slot:r.slot,extended:r.extended,arrived:r.arrived,taken:r.taken||[],
        trafficDelay:0,rampDelay:0,segments:r.segments});added++}}
  save();return{added,skipped,dates:Object.keys(byDate).sort()}}
// The CSV export carries a single day, which is right for handing a board to
// someone else but wrong as a backup: everything lives in one browser, and the
// weekly analysis reads every day at once. So the whole state travels as one file.
function backupAll(){
  const blob=JSON.stringify({app:"tachoplan",version:2,savedAt:new Date().toISOString(),days:state.days});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([blob],{type:"application/json"}));
  a.download="tachoplan-backup-"+todayStr()+".json";a.click();URL.revokeObjectURL(a.href);
}
function restoreAll(text){
  let p;try{p=JSON.parse(text)}catch(e){return{ok:false,msg:"not a valid backup file"}}
  if(!p||typeof p!=="object"||!p.days||typeof p.days!=="object")return{ok:false,msg:"this file has no board data in it"};
  const dates=Object.keys(p.days).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  if(!dates.length)return{ok:false,msg:"the backup contains no dated boards"};
  const trucks=dates.reduce((n,d)=>n+((p.days[d]&&p.days[d].trucks)||[]).length,0);
  if(!confirm("Restore "+trucks+" trucks across "+dates.length+" day(s)?\n\nThis replaces everything currently on this device."))
    return{ok:false,msg:"restore cancelled"};
  state.days={};dates.forEach(d=>{state.days[d]={trucks:(p.days[d].trucks||[])}});
  state.openId=null;state.demo=false;save();
  if(!state.days[state.date])state.date=dates.sort()[dates.length-1];
  return{ok:true,msg:trucks+" trucks restored across "+dates.length+" day(s)",dates};
}

// ---------- distances from Google Maps (asked for, never automatic) ----------
// The board exists to work in a yard with no signal, so nothing here runs by
// itself: the dispatcher presses the button, that one tour's places go to Google,
// and the answer is kept in the day's data. Offline the stored figures still show,
// and a leg's distance can always be typed by hand instead.
//
// The key is the dispatcher's own and lives beside the board, never inside it: a
// CSV or a backup handed to somebody else must not carry it.
//
// Routes API v2 is used rather than the legacy Distance Matrix because it is the
// one Google serves with CORS headers — the legacy endpoint is refused by the
// browser, which is why this needs no script tag and no library.
const MAPKEY="tachoplan-maps-key", MAPOPT="tachoplan-maps-opts";
function mapKey(){try{return localStorage.getItem(MAPKEY)||""}catch(e){return""}}
function setMapKey(v){try{v?localStorage.setItem(MAPKEY,v):localStorage.removeItem(MAPKEY)}catch(e){}}
function mapOpts(){try{return Object.assign({traffic:true,tolls:false,kmh:0},JSON.parse(localStorage.getItem(MAPOPT)||"{}"))}
  catch(e){return{traffic:true,tolls:false,kmh:0}}}
function setMapOpt(k,v){const o=mapOpts();o[k]=v;try{localStorage.setItem(MAPOPT,JSON.stringify(o))}catch(e){}}

// The request Google is asked, built from the tour alone so it can be checked
// without a key. Every driving leg is one leg of the route, in order, which is
// what lets the answer be written straight back onto the segments.
function routeBody(tr,now,opts){
  const chain=placeChain(tr);
  const legs=(tr.segments||[]).filter(g=>g.type==="drive");
  if(!legs.length)throw new Error("This tour has no driving legs to measure.");
  const missing=[];
  if(!chain[0])missing.push("where the tour starts from");
  legs.forEach((g,i)=>{if(!chain[i+1])missing.push("where \u201c"+(g.label||"leg "+(i+1))+"\u201d drives to")});
  if(missing.length)throw new Error("Fill in "+missing.join(", ")+" first.");
  // Traffic-aware timing needs a departure in the future; a tour already under way
  // or a day being replanned in hindsight gets the plain figure rather than an error.
  const dep=parseTime(tr.start,state.date);
  const traffic=!!opts.traffic&&dep>now;
  const body={
    origin:{address:chain[0]},
    destination:{address:chain[chain.length-1]},
    travelMode:"DRIVE",
    routingPreference:traffic?"TRAFFIC_AWARE":"TRAFFIC_UNAWARE",
    routeModifiers:{avoidTolls:!!opts.tolls},
    units:"METRIC"};
  if(chain.length>2)body.intermediates=chain.slice(1,-1).map(a=>({address:a}));
  if(traffic)body.departureTime=dep.toISOString();
  return{body,legs,traffic};
}
async function routeTruck(tr){
  const key=mapKey();
  if(!key)throw new Error("No Google key yet \u2014 open Maps in the top bar and paste one in.");
  const{body,legs}=routeBody(tr,new Date(),mapOpts());
  let r,j;
  try{
    r=await fetch("https://routes.googleapis.com/directions/v2:computeRoutes",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":key,
        "X-Goog-FieldMask":"routes.distanceMeters,routes.duration,routes.legs.distanceMeters,routes.legs.duration"},
      body:JSON.stringify(body)});
  }catch(e){throw new Error("Could not reach Google \u2014 no signal, or the request was blocked. The distances already stored are still on the board.")}
  try{j=await r.json()}catch(e){j=null}
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||("Google refused the request ("+r.status+")."));
  const route=j&&j.routes&&j.routes[0];
  if(!route||!route.legs)throw new Error("Google found no route between these places \u2014 check the addresses.");
  if(route.legs.length!==legs.length)throw new Error("Google split the route into "+route.legs.length+" legs, the tour has "+legs.length+". Check for a repeated or empty place.");
  // The tool fills the time until a human disagrees with it. Once the dispatcher
  // has overridden a leg, his figure stands and the tool's is only shown beside it
  // — re-measuring must not quietly undo a correction somebody made on purpose.
  // The test is against autoMin, what was last written here, not against the map's
  // own figure: otherwise changing the fleet speed would make every leg look
  // hand-corrected and nothing would ever be filled in again.
  const kmh=+mapOpts().kmh||0;
  let applied=0;
  route.legs.forEach((lg,i)=>{
    const g=legs[i];
    const untouched=!g.autoMin||g.mins===g.autoMin;
    g.km=Math.round((lg.distanceMeters||0)/1000);
    g.mapMin=Math.max(1,Math.round(parseFloat(lg.duration||"0")/60));
    g.mapAt=Date.now();
    if(untouched){g.mins=g.autoMin=Math.max(1,planMin(g,kmh));applied++}
  });
  return{legs:legs.length,applied,km:tourKm(tr),kmh};
}

    save();render()},
  // Opening the cut form for one leg closes any other: two open forms would share
  // the same field ids, and the second would read the first one's boxes.
  split:(id,i)=>{const k=i<0?null:id+":"+i;
    state.splitAt=(k&&state.splitAt!==k)?k:null;render()},
  doSplit:(id,i)=>{
    const t=curTrucks().find(t=>t.id===id);if(!t)return;
    const sg=t.segments[i];if(!sg||sg.type!=="drive")return;
    const g=n=>document.getElementById(n+"-"+id);
    const after=(parseInt(g("xh").value)||0)*60+(parseInt(g("xm").value)||0);
    if(!(after>0&&after<sg.mins)){
      alert("The stop has to leave driving on both sides — pick a point between 0h01 and "+fmtHM(sg.mins-1)+" into this leg.");return}
    const mins=(parseInt(g("xdh").value)||0)*60+(parseInt(g("xdm").value)||0);
    if(mins<=0){alert("Give the stop a length.");return}
    const type=g("xt").value, label=(g("xl").value||"").trim();
    const mid={type,mins,label,who:sg.who||1};
    if(type==="swap"){
      const tk=(g("xtk").value||"").trim(), mt=(g("xmt").value||"").trim().toUpperCase();
      if(tk)mid.takes=tk;if(mt)mid.meet=mt}
    t.segments.splice(i,1,...splitLeg(sg,after,mid));
    state.splitAt=null;save();render()},
  // One tap when the driver calls in: the tour stops being watched and the actual
  // time is kept next to the plan, which is what an Amazon dispute later needs.
  // The driver calls "I am taking my break now". One tap stamps the real time —
  // tapping again while that break is still running takes it back, for a mis-click.
  // First tap: the driver has stopped, and the break stays OPEN — its length is
  // whatever he actually stands there. Second tap: he is rolling again, so the real
  // duration is written down. Tapping straight back removes a mis-click.
  breakNow:(id,ev)=>{if(ev)ev.stopPropagation();
    const t=curTrucks().find(t=>t.id===id);if(!t)return;
    t.taken=t.taken||[];
    const i=runningBreakIndex(t);
    if(i>=0){
      const stood=Math.round((new Date()-parseTime(t.taken[i].at,state.date))/MIN);
      if(stood<1)t.taken.splice(i,1);
      else{t.taken[i].mins=stood;t.taken[i].open=false}
    }else t.taken.push({at:fmtClock(new Date()),mins:45,open:true});
    save();render()},
  addBreak:(id,mins)=>{const t=curTrucks().find(t=>t.id===id);if(!t)return;
    t.taken=t.taken||[];t.taken.push({at:fmtClock(new Date()),mins:mins||45});save();render()},
  setBreak:(id,i,field,val)=>{const t=curTrucks().find(t=>t.id===id);if(!t||!t.taken[i])return;
    t.taken[i][field]=field==="mins"?Math.max(1,parseInt(val)||45):val;save();render()},
  rmBreak:(id,i)=>{const t=curTrucks().find(t=>t.id===id);if(!t)return;
    t.taken.splice(i,1);save();render()},
  arrive:(id,ev)=>{if(ev)ev.stopPropagation();
    const t=curTrucks().find(t=>t.id===id);if(!t)return;
    const list=tourStops(t,simulate(t));
    const n=nextStopIndex(list);
    const stamp=fmtClock(new Date());
    if(n>=0){const st=list[n];
      if(st.kind==="end")t.arrived=stamp;else t.segments[st.i].arrived=stamp}
    else{ // everything is ticked: take the last one back, for a mis-click
      const last=list[list.length-1];
      if(last.kind==="end")t.arrived="";else t.segments[last.i].arrived=""}
    save();render()},
  setStopArrived:(id,segIndex,v)=>{const t=curTrucks().find(t=>t.id===id);if(!t||!t.segments[segIndex])return;
    t.segments[segIndex].arrived=v||"";save();render()},
  setStopSlot:(id,segIndex,v)=>{const t=curTrucks().find(t=>t.id===id);if(!t||!t.segments[segIndex])return;
    t.segments[segIndex].slot=v||"";save();render()},
  setArrived:(id,v)=>{const t=curTrucks().find(t=>t.id===id);if(!t)return;
    t.arrived=v||"";save();render()},
  rmSeg:(id,i)=>{const t=curTrucks().find(t=>t.id===id);t.segments.splice(i,1);state.splitAt=null;save();render()},
  // Nothing is asked of Google until this is pressed, and only for this one tour.
  mapsToggle:()=>{state.mapsOpen=!state.mapsOpen;render()},
  route:async id=>{
    const t=curTrucks().find(t=>t.id===id);if(!t)return;
    // With no key there is nothing to ask, so open the panel and put the caret in
    // the field rather than telling the dispatcher where to go looking for it.
    if(!mapKey()){
      state.mapsOpen=true;
      state.mapMsg={id,level:"violation",text:"No Google key yet — the Maps panel is open at the top of the board, paste one in there."};
      render();
      const el=document.getElementById("mapkey");
      if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.focus()}
      return}
    state.mapBusy=id;state.mapMsg=null;render();
    try{
      const r=await routeTruck(t);
      state.mapMsg={id,level:"info",text:r.legs+" leg"+(r.legs===1?"":"s")+" measured · "+r.km+" km"+
        (r.kmh?" · timed at "+r.kmh+" km/h where that is slower":"")+
        (r.applied<r.legs?" · "+(r.legs-r.applied)+" kept the time you set":"")};
      save();
    }catch(e){state.mapMsg={id,level:"violation",text:e.message||String(e)}}
    state.mapBusy=null;render();},
  mapKey:v=>{setMapKey(String(v||"").trim());render()},
  mapOpt:(k,v)=>{setMapOpt(k,v);render()},
  mvSeg:(id,i,dir)=>{const t=curTrucks().find(t=>t.id===id);const j=i+dir;
    if(j<0||j>=t.segments.length)return;
    [t.segments[i],t.segments[j]]=[t.segments[j],t.segments[i]];state.splitAt=null;save();render()},
  segWho:(id,i)=>{const t=curTrucks().find(t=>t.id===id);const s=t.segments[i];
    s.who=s.who===2?1:2;save();render()},
};

// ---------- shared day timeline ----------
// One scale for the whole board: the window runs from the earliest tour start to
// the latest end (or slot), snapped to whole hours. Per-row scaling would make a
// 4-hour tour look as long as a 13-hour one.
function dayScale(rows){
  let lo=null,hi=null;
  const take=(d)=>{if(!d)return;if(lo===null||d<lo)lo=d;if(hi===null||d>hi)hi=d};
  for(const r of rows){if(!r.sim.events.length)continue;take(r.sim.start);take(r.sim.end);
    if(r.sim.slotInfo)take(r.sim.slotInfo.slot)}
  if(lo===null){lo=parseTime("06:00");hi=parseTime("18:00")}
  const t0=new Date(lo);t0.setMinutes(0,0,0);
  const t1=new Date(hi);if(t1.getMinutes()||t1.getSeconds())t1.setHours(t1.getHours()+1,0,0,0);
  if(t1-t0<4*3600000)t1.setTime(t0.getTime()+4*3600000);
  const span=t1-t0;
  return{t0,t1,span,pct:d=>Math.max(0,Math.min(100,(d-t0)/span*100))};
}
function rulerTicks(sc){
  const hours=sc.span/3600000;
  const step=hours>20?4:hours>12?2:1;
  const out=[];
  const t=new Date(sc.t0);
  while(t<=sc.t1){
    const h=t.getHours();
    if(h%step===0)out.push({p:sc.pct(t),lab:pad2(h)+":00"});
    t.setHours(t.getHours()+1);
  }
  return out;
}

function truckStatus(x,drv){
  let st=x.sim.status;const extra=[];
  const names=[x.tr.driver];if(x.tr.crew)names.push(x.tr.driver2);
  for(const n of names){if(!drvKey(n))continue;
    for(const i of issuesFor(drv,n)){
      if(RANK[i.level]>RANK[st])st=i.level;
      extra.push({level:i.level,msg:n.trim()+": "+i.msg})}}
  for(const i of meetIssues(x.tr,MEETS)){
    if(RANK[i.level]>RANK[st])st=i.level;
    extra.push({level:i.level,msg:i.msg,meet:true})}
  return{st,extra};
}

// A tile that counts trucks names a set of them, so pressing it puts that set on
// the board and nothing else. The tiles that are totals — drivers on duty, fleet
// driving time — have no subset behind them and stay plain. One selection at a
// time, the way the status chips already work: two filters at once would be a rule
// nobody can read off the board.
const TILE_FILTER={due:"Due within 1h",arrived:"Arrived",tight:"Tightest slot",
  delayed:"Delayed",issues:"To fix"};
// Nothing is live on any date except today, so these two mean nothing on a
// planning view and are dropped rather than left to empty the board.
const LIVE_FILTER=new Set(["due","arrived"]);
function filterRows(rows,f){
  switch(f){
    case "ok":case "risk":case "violation":return rows.filter(r=>r.st===f);
    case "issues":return rows.filter(r=>r.st!=="ok");
    case "delayed":return rows.filter(r=>r.tr.trafficDelay>0||r.tr.rampDelay>0);
    // One number on the tile, and behind it whichever truck holds it — with every
    // truck tied with it, because a dispatcher chasing the tightest slot needs to
    // see all of them, not the first one the sort happened to return.
    case "tight":{const w=rows.filter(r=>r.sim.slotInfo);if(!w.length)return[];
      const m=Math.min(...w.map(r=>r.sim.slotInfo.diff));
      return w.filter(r=>r.sim.slotInfo.diff===m)}
    // The tile carries both numbers it is counting, so pressing it has to return
    // both: the trucks closing in, and the ones already past due.
    case "due":{const now=new Date();return rows.filter(r=>{const l=liveOf(r.tr,r.sim,now);
      return l.phase==="overdue"||(l.phase==="running"&&l.etaMin<=60)})}
    case "arrived":{const now=new Date();
      return rows.filter(r=>liveOf(r.tr,r.sim,now).phase==="arrived")}
    default:return rows;
  }
}

function renderTiles(rows,drv){
  const counts={ok:0,risk:0,violation:0};rows.forEach(r=>counts[r.st]++);
  const drivers=new Set();
  rows.forEach(r=>{if(drvKey(r.tr.driver))drivers.add(drvKey(r.tr.driver));
    if(r.tr.crew&&drvKey(r.tr.driver2))drivers.add(drvKey(r.tr.driver2))});
  const drive=rows.reduce((s,r)=>s+r.sim.totalDrive,0);
  const delayMin=rows.reduce((s,r)=>s+(r.tr.trafficDelay||0)+(r.tr.rampDelay||0),0);
  const delayed=rows.filter(r=>r.tr.trafficDelay>0||r.tr.rampDelay>0).length;
  const buffers=rows.filter(r=>r.sim.slotInfo).map(r=>r.sim.slotInfo.diff);
  const tight=buffers.length?Math.min(...buffers):null;
  const issues=counts.risk+counts.violation;
  const body=(ico,val,lab)=>`<div class="ico">${ico}</div><div class="kv"><b>${val}</b><span>${lab}</span></div>`;
  const tile=(cls,ico,val,lab,f)=>{
    if(!f)return `<div class="tile ${cls}">${body(ico,val,lab)}</div>`;
    const on=state.filter===f;
    return `<button class="tile ${cls}${on?" on":""}" aria-pressed="${on}" title="${
      on?"Showing only these — press again for the whole board":"Show only these trucks on the board"
      }" onclick="A.tileFilter('${on?"all":f}')">${body(ico,val,lab)}</button>`};
  const dim=v=>"<span style='font-size:13px;color:var(--text3);font-weight:500'> "+v+"</span>";
  const trucks=tile("",I.truck,rows.length+dim("/ "+MAX_TRUCKS),"Trucks planned");
  const buffer=tile(tight===null?"":tight<0?"bad":tight<20?"risk":"ok",I.target,
      tight===null?"—":(tight<0?"−":"+")+fmtHM(Math.abs(tight)),"Tightest slot buffer",
      tight===null?null:"tight");
  const delays=tile(delayed?"risk":"",I.cone,delayed?delayed+dim("· "+delayMin+"m"):"0","Trucks delayed",
      delayed?"delayed":null);
  const fix=tile(counts.violation?"bad":issues?"risk":"ok",issues?I.alert:I.check,
      issues||"0",issues?"Tours to fix":"All tours legal",issues?"issues":null);
  // Six tiles either way, but a shift asks different questions than a plan does:
  // while the day is running, who is close and who is done beats fleet totals.
  let set;
  if(state.date===todayStr()){
    const now=new Date();
    const live=rows.map(r=>liveOf(r.tr,r.sim,now));
    const soon=live.filter(l=>l.phase==="running"&&l.etaMin<=60).length;
    const arrived=live.filter(l=>l.phase==="arrived").length;
    const overdue=live.filter(l=>l.phase==="overdue").length;
    set=[trucks,
      tile(overdue?"bad":soon?"risk":"",I.clock,
        soon+(overdue?"<span style='font-size:13px;color:var(--bad-t);font-weight:600'> · "+overdue+" overdue</span>":""),
        "Arriving within 1h",soon+overdue?"due":null),
      tile(arrived?"ok":"",I.check,arrived+dim("/ "+rows.length),"Arrived",arrived?"arrived":null),
      buffer,delays,fix];
  }else{
    set=[trucks,tile("",I.drivers,drivers.size,"Drivers on duty"),
      tile("",I.clock,fmtHM(drive),"Fleet driving time"),buffer,delays,fix];
  }
  document.getElementById("tiles").innerHTML=set.join("");
}

  document.getElementById("barrow").innerHTML=
    [["all","All",null],["ok","Legal","ok"],["risk","Risk","risk"],["violation","Violation","violation"]]

        s?`<span class="dot" style="background:${SC[s]}"></span>`:""}${lab} ${n}</button>`}).join("")+
    // A tile filter has no chip of its own, and without one the board would be cut

    (TILE_FILTER[state.filter]
      ?`<button class="chip on" title="Press to show the whole board again" onclick="A.filter('all')">${
         TILE_FILTER[state.filter]} ${filterRows(rows,state.filter).length} ✕</button>`:"")+
    `<div style="flex:1"></div>
     ${rows.some(r=>r.tr.trafficDelay||r.tr.rampDelay)?`<button class="btn sm" onclick="A.clearDelays()">Clear delays</button>`:""}
     ${rows.length?`<button class="btn sm danger" onclick="A.reset()">Clear day</button>`:""}`;

      <button class="btn" onclick="A.importToggle()">Import CSV</button>

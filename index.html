        ?`<button class="btn" onclick="A.demo()">See a sample fleet</button>`:""}</div></div>`;return}

  const q=state.q;
  // A dispatcher searches for whatever they have in hand: a truck number, a driver
  // on the phone, a trailer someone is looking for, an FC in a label, or a meet code.
  const hay=r=>[r.tr.name,r.tr.driver,r.tr.driver2,r.tr.trailer,
    ...r.tr.segments.map(sg=>[sg.label,sg.takes,sg.meet].filter(Boolean).join(" "))]
    .filter(Boolean).join(" ").toLowerCase();
  const visible=filterRows(rows,state.filter).filter(r=>!q||hay(r).includes(q));
  if(!visible.length){view.innerHTML=`<div class="empty"><div class="eh">No trucks match</div>
    <div class="es">${q?`Nothing for “${esc(q)}”.`:""} Try a different filter.</div></div>`;return}

  const sc=dayScale(rows);
  const ticks=rulerTicks(sc);
  const now=new Date();
  const isToday=state.date===todayStr();
  const showNow=isToday&&now>=sc.t0&&now<=sc.t1;

  view.innerHTML=`<div class="board">
    <div class="ruler"><div class="grid5">
      <div class="rlab">Truck</div><div class="rlab d">Driver</div>
      <div class="rtrack">${ticks.map(t=>`<div class="tl-h" style="left:${t.p}%">${t.lab}</div>`).join("")}</div>
      <div class="rlab r">Driving</div><div class="rlab r">Slot</div><div class="rlab"></div>
    </div></div>
    ${visible.map(r=>truckRow(r,sc,showNow?sc.pct(now):null,isToday?now:null)).join("")}
  </div>`;
}

function truckRow({tr,sim:s,st,extra},sc,nowPct,now){
  const open=state.openId===tr.id;
  const hasDelay=tr.trafficDelay>0||tr.rampDelay>0;
  const live=now?liveOf(tr,s,now):{phase:"none"};
  const onBreakNow=runningBreakIndex(tr)>=0;
  const stood=stoodFor(tr);
  const stopsList=tourStops(tr,s);
  const doneStops=stopsList.filter(x=>x.arrived).length;
  const tourDone=!!tr.arrived;
  const nextIdx=nextStopIndex(stopsList);
  const nextStop=nextIdx>=0?stopsList[nextIdx]:null;
  const tourSpan=Math.max((s.end-s.start)/MIN,1);
  // A leg cut in two by an inserted break stays ONE leg to the planner, so the
  // label is printed on its first part only — otherwise the strip reads as two
  // separate runs to the same FC.
  let lastLab="";
  const segs=s.events.map(e=>{const cont=e.type!=="break"&&e.label===lastLab;
      if(e.type!=="break")lastLab=e.label;
      return `<div class="seg" style="width:${e.mins/tourSpan*100}%;background:${TCOL[e.type]}" title="${
      esc(e.label)}${e.takes?" → "+esc(e.takes):""} · ${fmtHM(e.mins)} · ${fmtClock(e.start)}–${fmtClock(e.end)}">${
      e.mins>=50&&!cont?`<span>${esc(e.label)}</span>`:""}</div>`}).join("");
  // Everything still ahead of the clock is veiled, so the solid part of the strip
  // is what the truck has actually done — the row reads at a glance while moving.
  const veil=live.phase==="running"
    ?`<div class="seg-veil" style="left:${Math.max(0,Math.min(100,live.donePct))}%"></div>`:"";
  const bar=s.events.length
    ?`<div class="tl-bar" style="left:${sc.pct(s.start)}%;width:${sc.pct(s.end)-sc.pct(s.start)}%">${segs}${veil}</div>`
    :`<div class="tl-empty">no tour planned</div>`;
  const swapEvents=s.events.filter(e=>e.type==="swap"&&e.meet);
  const partnerOf=e=>{const m=MEETS[e.meet];if(!m)return"";
    const others=m.parts.filter(p=>p.id!==tr.id);
    return others.length?others.map(p=>p.truck+" "+fmtClock(p.start)+"–"+fmtClock(p.end)).join(", "):"no partner on this board"};
  const meetDots=swapEvents.map(e=>
    `<div class="tl-meet" style="left:${sc.pct(new Date((+e.start+ +e.end)/2))}%" title="Meet ${esc(e.meet)} · ${
      esc(e.label)} · here ${fmtClock(e.start)}–${fmtClock(e.end)} · partner: ${esc(partnerOf(e))}"></div>`).join("");
  const meetTitle=swapEvents.map(e=>"Meet "+e.meet+" with "+partnerOf(e)).join(" · ");
  // Every booked time on the tour gets its own pin, not just the last one.
  const slotMark=stopsList.filter(x=>x.slotAt).map(x=>{
    const late=x.diff!==null&&x.diff<0;
    const col=x.arrived?"var(--ok)":late?"var(--bad)":SC[st];
    return `<div class="tl-slot" style="left:${sc.pct(x.slotAt)}%;background:${col};color:${col}" title="${
      esc(x.label)} · slot ${fmtClock(x.slotAt)}${x.arrived?" · arrived "+esc(x.arrived):""}"></div>`}).join("");
  const nowMark=nowPct!==null?`<div class="tl-now" style="left:${nowPct}%"></div>`:"";
  const driveTxt=tr.crew?fmtHM(Math.max(s.d1,s.d2)):fmtHM(s.totalDrive);
  // The number that matters is the buffer on the point the truck is heading for now,
  // not on the end of a tour it will not reach for hours.
  const watch=stopsList.find(x=>!x.arrived&&x.slotAt)||null;
  const slotTxt=watch?(watch.diff>=0?"+"+fmtHM(watch.diff):"−"+fmtHM(-watch.diff))
    :(s.slotInfo&&tourDone?(s.slotInfo.diff>=0?"+"+fmtHM(s.slotInfo.diff):"−"+fmtHM(-s.slotInfo.diff)):SL[st]);
  const chain=trailerChain(tr,s);

  let liveTxt="",liveCls="";
  if(live.phase==="arrived"){const early=live.delta>=0;liveCls=early?"arr":"late";
    liveTxt="ARR "+tr.arrived+(Math.abs(live.delta)>=1?(early?" +":" −")+fmtHM(Math.abs(live.delta)):"")}
  else if(live.phase==="before")liveCls="wait",liveTxt="in "+fmtHM(live.inMin);
  else if(stood!==null)
    // Counting up, because the question during an open break is how long he has
    // been there. Amber until the 45 minutes are served, green once he may roll.
    liveCls=stood>=45?"brk":"run",liveTxt="STOOD "+fmtHM(stood);
  else if(live.phase==="running"&&live.onBreak)liveCls="brk",
    liveTxt=(live.reported?"BREAK ":"break ")+fmtHM(live.breakLeft);
  else if(live.phase==="running"){
    // Counting down to the next place the truck is due, which is what the dispatcher
    // is waiting on — the end of the tour may be several stops away.
    const target=nextStop&&nextStop.at>now?(nextStop.at-now)/MIN:live.etaMin;
    liveCls=target<=60?"soon":"run";liveTxt="ETA "+fmtHM(target)}
  else if(live.phase==="overdue")liveCls="late",liveTxt="due "+fmtHM(live.lateMin)+" ago";

  return `<div class="trow ${open?"open":""} ${tourDone?"done":""}">
    <div class="thead grid5" onclick="A.toggle('${tr.id}')">
      <div class="tname">
        <span class="dot" style="background:${tr.arrived?"var(--ok)":SC[st]}" title="${tr.arrived?"Arrived":SL[st]}"></span><span class="vh">${tr.arrived?"Arrived":SL[st]}</span>
        <b>${esc(tr.name)}</b>
        ${tr.crew?`<span class="badge crew">2×</span>`:""}
        ${tr.trafficDelay>0?`<span class="badge traffic" title="Traffic ${tr.trafficDelay} min — counts as driving, so it burns the driver's hours, and it goes in where the truck is now: every point still ahead moves with it">TRAFFIC</span>`:""}
        ${tr.rampDelay>0?`<span class="badge ramp" title="Ramp queue ${tr.rampDelay} min — counts as other work, so it shifts every point still ahead but not the driving hours">RAMP</span>`:""}
        ${swapEvents.length?`<span class="badge meet" title="${esc(meetTitle)}">MEET</span>`:""}
        ${stopsList.length>1?`<span class="badge stops" title="${esc(stopsList.map(x=>(x.arrived?"✓ ":"· ")+x.label+(x.slot?" (slot "+x.slot+")":"")).join(" · "))}">${doneStops}/${stopsList.length}</span>`:""}
      </div>
      <div class="drv">${esc(tr.driver)||"<i>no driver</i>"}${tr.crew&&tr.driver2?" + "+esc(tr.driver2.split(" ")[0]):""}
        ${now&&nextStop&&!tourDone&&stopsList.length>1?`<span class="trailer" title="Next point on the tour">→ ${esc(nextStop.label)}${kmToNext(tr,stopsList,nextIdx)?" · "+kmToNext(tr,stopsList,nextIdx)+" km":""}</span>`:
          chain.length?`<span class="trailer">${chain.length>1?esc(chain[0])+" → <b>"+esc(chain[chain.length-1])+"</b>":"<b>"+esc(chain[0])+"</b>"}</span>`:""}</div>
      <div class="tl"><div class="tl-grid">${
        rulerTicks(sc).map(t=>`<div class="tl-tick" style="left:${t.p}%"></div>`).join("")}</div>${bar}${slotMark}${meetDots}${nowMark}</div>
      <div class="hrs ${Math.max(s.d1,s.d2)>s.driveLimit?"over":""}" title="${tr.crew?"D1 "+fmtHM(s.d1)+" · D2 "+fmtHM(s.d2):""}">${driveTxt}<small>of ${fmtHM(s.driveLimit)}</small>${
        tourKm(tr)?`<small class="kmrow" title="Planned distance of the whole tour">${tourKm(tr)} km</small>`:""}</div>
      <div class="slotv" style="color:${tr.arrived?"var(--ok-t)":SC[st]}" title="${s.events.length?fmtClock(s.start)+" → "+fmtClock(s.end):""}">${slotTxt}${
        liveTxt?`<span class="live ${liveCls}">${liveTxt}</span>`
              :`<small>${s.events.length?fmtClock(s.start)+"→"+fmtClock(s.end):"—"}</small>`}</div>
      <div class="acts">
        <button class="arrbtn brk ${onBreakNow?"on":""}" title="${onBreakNow&&stood!==null
          ?"Standing "+fmtHM(stood)+(stood<45?" — needs "+fmtHM(45-stood)+" more for a legal break":" — legal since "+fmtClock(new Date(Date.now()-(stood-45)*MIN)))+" · click when he rolls again"
          :"Driver has stopped — click again when he rolls"}" onclick="A.breakNow('${tr.id}',event)">${I.pause}</button>
        <button class="arrbtn ${tourDone?"on":""}" title="${nextStop
          ?"Driver reports arrival at "+esc(nextStop.label)+(nextStop.slot?" (slot "+nextStop.slot+")":"")
          :"Tour complete — click to take the last arrival back"}" onclick="A.arrive('${tr.id}',event)">${I.check}</button>
      </div>
    </div>
    ${open?editor(tr,s,extra):""}
  </div>`;
}

// A trailer swap is not always the end of the run: the driver stands part-way,
// changes trailer and drives on. That is one leg becoming two with a stop between
// them, so the leg is cut here rather than deleted and retyped as three.
function splitForm(tr,i,sg){
  const half=Math.max(1,Math.round(sg.mins/2));
  return `<div class="sgr splitrow">
    <span class="stag light" style="background:var(--work)">SPLIT</span>
    <span style="font-size:12.5px;color:var(--text2)">stands after</span>
    <input class="field" id="xh-${tr.id}" type="number" min="0" value="${Math.floor(half/60)}" style="width:64px;height:28px">
    <span class="u" style="font-size:11.5px;color:var(--text3)">h</span>
    <input class="field" id="xm-${tr.id}" type="number" min="0" max="59" value="${half%60}" style="width:64px;height:28px">
    <span class="u" style="font-size:11.5px;color:var(--text3)">m</span>
    <select class="field" id="xt-${tr.id}" style="height:28px;font-size:12px">
      <option value="swap">Trailer swap</option><option value="other">Other work</option><option value="break">Extra break</option></select>
    <input class="field" id="xl-${tr.id}" placeholder="where — e.g. Meet A2" style="flex:1;min-width:110px;height:28px">
    <input class="field" id="xtk-${tr.id}" placeholder="→ trailer" title="Swap only: the trailer taken here" style="width:88px;height:28px">
    <input class="field" id="xmt-${tr.id}" placeholder="meet" title="Swap only: meet code shared with the partner truck" style="width:58px;height:28px">
    <input class="field" id="xdh-${tr.id}" type="number" min="0" value="0" style="width:64px;height:28px">
    <span class="u" style="font-size:11.5px;color:var(--text3)">h</span>
    <input class="field" id="xdm-${tr.id}" type="number" min="0" max="59" value="30" style="width:64px;height:28px">
    <span class="u" style="font-size:11.5px;color:var(--text3)">m</span>
    <button class="btn primary sm" onclick="A.doSplit('${tr.id}',${i})">Insert</button>
    <button class="mini del" title="Cancel" onclick="A.split('${tr.id}',-1)">${I.x}</button>
  </div>`;
}
function editor(tr,s,extra){
  const KMH=+mapOpts().kmh||0;
  const segs=tr.segments.map((sg,i)=>{
    // What the tool makes of this leg, and why — shown only where it disagrees
    // with the plan by more than a rounding minute.
    const want=sg.type==="drive"?planMin(sg,KMH):0;
    const off=want&&Math.abs(want-sg.mins)>2;
    const why=[];
    if(off){
      if(sg.mapMin)why.push("Google measured "+fmtHM(sg.mapMin)+" for a car");
      if(KMH>0&&sg.km)why.push(sg.km+" km at "+KMH+" km/h is "+fmtHM(Math.round(sg.km/KMH*60)));
      why.push("the plan says "+fmtHM(sg.mins));
    }
    return `<div class="sgr">
      <span class="stag ${sg.type==="other"||sg.type==="swap"?"light":""}" style="background:${TCOL[sg.type]||TCOL.other}">${TLAB[sg.type]||"WORK"}</span>
      ${tr.crew&&sg.type==="drive"?`<button class="dchip d${sg.who===2?2:1}" title="Switch driver" onclick="A.segWho('${tr.id}',${i})">D${sg.who===2?2:1}</button>`:""}
      <input class="field sl" value="${esc(sg.label)}" placeholder="untitled" title="What this leg is" onchange="A.setSeg('${tr.id}',${i},'label',this.value)">
      ${sg.type==="swap"&&sg.takes?`<span class="takes">→ ${esc(sg.takes)}</span>`:""}
      ${sg.type==="swap"&&sg.meet?`<span class="mchip" title="Meet point — the partner truck must be here at the same time">${esc(sg.meet)}</span>`:""}
      ${sg.type==="drive"?`
        <input class="field dest" value="${esc(sg.to||"")}" placeholder="drives to…" title="Where this leg ends — the address the distance is looked up against" onchange="A.setSeg('${tr.id}',${i},'to',this.value)">
        <input type="number" min="0" class="field kmin" value="${sg.km||""}" placeholder="km" title="Distance of this leg" onchange="A.setSeg('${tr.id}',${i},'km',Math.max(0,parseInt(this.value)||0))">
        ${off?`<span class="kmv" style="color:var(--risk-t)" title="${esc(why.join("; ")+". A lorry is never quicker than the car, so the slower of the two stands.")}">≠ ${fmtHM(want)}</span>`:""}`:""}
      ${sg.type==="other"||sg.type==="swap"?`
        <input type="time" class="field slotin" value="${esc(sg.slot||"")}" title="Booked slot at this stop — leave empty if there is none" onchange="A.setStopSlot('${tr.id}',${i},this.value)">
        ${sg.arrived?`<button class="arrchip" title="Arrived ${esc(sg.arrived)} — click to clear" onclick="A.setStopArrived('${tr.id}',${i},'')">✓ ${esc(sg.arrived)}</button>`:""}`:""}
      <span class="sm">${fmtHM(sg.mins)}</span>
      ${sg.type==="drive"?`<button class="mini" title="Split this leg — stand part-way, swap the trailer, drive on" onclick="A.split('${tr.id}',${i})">${I.scissors}</button>`:""}
      <button class="mini" title="Move up" onclick="A.mvSeg('${tr.id}',${i},-1)">${I.up}</button>
      <button class="mini" title="Move down" onclick="A.mvSeg('${tr.id}',${i},1)">${I.down}</button>
      <button class="mini del" title="Remove" onclick="A.rmSeg('${tr.id}',${i})">${I.x}</button>
    </div>${state.splitAt===tr.id+":"+i?splitForm(tr,i,sg):""}`}).join("");

  const wk=[];
  for(const nm of[tr.driver,tr.crew?tr.driver2:""]){const k=drvKey(nm);if(!k)continue;
    const r=DRV[k];if(!r)continue;
    const w=r.weeks[mondayOf(state.date)];
    if(w)wk.push(`<b>${esc(nm.trim())}</b> — week ${fmtHM(w.drive)} of 56h00 · ${fmtHM(Math.max(0,56*60-w.drive))} left · extended days ${w.ext.length}/2`)}

  const warn=s.warnings.map(w=>`<div class="wl ${s.status}">${I.alert}<span>${esc(w)}</span></div>`)
    .concat(extra.map(e=>`<div class="wl ${e.level}">${I.alert}<span><b>${e.meet?"Swap":"Week"}</b> · ${esc(e.msg)}</span></div>`)).join("");

  return `<div class="editor">
    <div class="ecard">
      <div class="ehd">Tour setup</div>
      <div class="fields">
        <div class="f"><label>Truck</label><input class="field" style="width:104px" value="${esc(tr.name)}" onchange="A.set('${tr.id}','name',this.value)"></div>
        <div class="f wide"><label>Driver${tr.crew?" 1":""}</label><input class="field" value="${esc(tr.driver)}" placeholder="Name" onchange="A.set('${tr.id}','driver',this.value)"></div>
        <div class="f"><label>Trailer</label><input class="field" style="width:104px" value="${esc(tr.trailer||"")}" placeholder="TR-0000" onchange="A.set('${tr.id}','trailer',this.value)"></div>
        <div class="f wide"><label>Starts from</label><input class="field" value="${esc(tr.place||"")}" placeholder="Yard or depot" title="Where the tour leaves from — the first place the distances are measured from" onchange="A.set('${tr.id}','place',this.value)"></div>
        ${tr.crew?`<div class="f wide"><label style="color:var(--work)">Driver 2</label><input class="field" value="${esc(tr.driver2)}" placeholder="Name" onchange="A.set('${tr.id}','driver2',this.value)"></div>`:""}
        <div class="f narrow"><label>Start</label><input type="time" class="field" value="${tr.start}" onchange="A.set('${tr.id}','start',this.value)"></div>
        <div class="f narrow"><label>Slot</label><input type="time" class="field" value="${tr.slot}" onchange="A.set('${tr.id}','slot',this.value)"></div>
        <label class="check ${tr.extended?"on":""}"><input type="checkbox" ${tr.extended?"checked":""} onchange="A.set('${tr.id}','extended',this.checked)">10h day</label>
        <label class="check ${tr.crew?"on":""}"><input type="checkbox" ${tr.crew?"checked":""} onchange="A.set('${tr.id}','crew',this.checked)">Crew 2×</label>
        <div class="f narrow"><label style="color:${tr.arrived?"var(--ok-t)":"var(--text3)"}">Arrived</label>
          <input type="time" class="field" value="${tr.arrived||""}" onchange="A.setArrived('${tr.id}',this.value)"></div>
        <div style="flex:1"></div>
        <button class="btn" onclick="A.dup('${tr.id}')">${I.copy}Duplicate</button>
        <button class="btn danger" onclick="A.del('${tr.id}')">${I.trash}Delete</button>
      </div>
    </div>

    <div class="ecard">
      <div class="ehd">Live disruption</div>
      <div class="dgrid">
        <div class="dbox">
          <span class="dl t" title="Lost on the road: it counts as driving and goes in where the truck is now — after the last point stamped as arrived — so every stop still ahead moves with it">Traffic delay — counts as driving</span>
          <div class="dr">
            <input type="number" min="0" class="field" value="${tr.trafficDelay||0}" onchange="A.set('${tr.id}','trafficDelay',Math.max(0,parseInt(this.value)||0))">
            <span class="u">min</span>
            <button class="qb" onclick="A.bump('${tr.id}','trafficDelay',15)">+15</button>
            <button class="qb" onclick="A.bump('${tr.id}','trafficDelay',30)">+30</button>
          </div>
        </div>
        <div class="dbox">
          <span class="dl r" title="Standing at the ramp: it counts as other work and goes in where the truck is now — after the last point stamped as arrived — so every stop still ahead moves, but the driving hours do not">Ramp queue — counts as other work</span>
          <div class="dr">
            <input type="number" min="0" class="field" value="${tr.rampDelay||0}" onchange="A.set('${tr.id}','rampDelay',Math.max(0,parseInt(this.value)||0))">
            <span class="u">min</span>
            <button class="qb" onclick="A.bump('${tr.id}','rampDelay',15)">+15</button>
            <button class="qb" onclick="A.bump('${tr.id}','rampDelay',30)">+30</button>
          </div>
        </div>
        ${tr.trafficDelay||tr.rampDelay?`<button class="btn sm" onclick="A.clearDelay('${tr.id}')">Clear</button>`:""}
      </div>
    </div>

    <div class="ecard">
      <div class="ehd">Breaks the driver actually took</div>
      ${(tr.taken||[]).length?(tr.taken||[]).map((b,i)=>{
        const open=!!b.open;
        const st=open&&state.date===todayStr()?Math.max(0,(new Date()-parseTime(b.at,state.date))/MIN):null;
        return `<div class="sgr">
          <span class="stag light" style="background:${open?"var(--risk)":"var(--brk)"}">${open?"OPEN":"TAKEN"}</span>
          <input type="time" class="field" style="width:104px;height:30px" value="${esc(b.at)}" onchange="A.setBreak('${tr.id}',${i},'at',this.value)">
          ${open
            ?`<span style="font-size:12.5px;color:var(--text2)">standing <b>${st===null?"—":fmtHM(st)}</b>${st!==null&&st<45?" · "+fmtHM(45-st)+" short of a legal break":""}</span>
              <span class="sl"></span>
              <button class="qb" onclick="A.breakNow('${tr.id}')">Driver is rolling</button>`
            :`<input type="number" class="field" style="width:64px;height:30px" min="1" value="${+b.mins||45}" onchange="A.setBreak('${tr.id}',${i},'mins',this.value)">
              <span class="u" style="font-size:11.5px;color:var(--text3)">min</span>
              <span class="sl"></span>`}
          <button class="mini del" title="Remove" onclick="A.rmBreak('${tr.id}',${i})">${I.x}</button>
        </div>`}).join(""):`<div style="font-size:12.5px;color:var(--text3);padding:2px 0 4px">Nothing reported yet — the plan uses the automatic 45 minutes after each 4h30.</div>`}
      <div class="addrow">
        <span style="font-size:12.5px;color:var(--text2)">Log a stop that is already over:</span>
        <button class="qb" onclick="A.addBreak('${tr.id}',15)">15 min</button>
        <button class="qb" onclick="A.addBreak('${tr.id}',30)">30 min</button>
        <button class="qb" onclick="A.addBreak('${tr.id}',45)">45 min</button>
        <button class="btn primary sm" onclick="A.breakNow('${tr.id}')">Driver is stopping now</button>
      </div>
    </div>

    <div class="ecard">
      <div class="ehd" style="display:flex;align-items:center;gap:9px">
        <span>Segments — breaks are inserted automatically</span>
        <div style="flex:1"></div>
        ${tourKm(tr)?`<span class="kmv">${tourKm(tr)} km</span>`:""}
        <button class="btn sm" ${state.mapBusy===tr.id?"disabled":""} onclick="A.route('${tr.id}')"
          title="Ask Google for the distance and driving time of every leg of this tour">${I.pin}${state.mapBusy===tr.id?"Measuring…":"Measure"}</button>
      </div>
      ${state.mapMsg&&state.mapMsg.id===tr.id?`<div class="wl ${state.mapMsg.level}" style="margin:2px 0 8px">${
        state.mapMsg.level==="info"?I.check:I.alert}<span>${esc(state.mapMsg.text)}</span></div>`:""}
      ${segs||`<div style="font-size:12.5px;color:var(--text3);padding:2px 0 4px">No segments yet. Add the first leg below.</div>`}
      <div class="addrow">
        <select class="field" id="st-${tr.id}"><option value="drive">Driving</option><option value="other">Other work</option><option value="swap">Trailer swap</option><option value="break">Extra break</option></select>
        ${tr.crew?`<select class="field" id="sw-${tr.id}"><option value="1">D1</option><option value="2">D2</option></select>`:""}
        <input class="field" id="sl-${tr.id}" placeholder="Label — e.g. To FC LEJ1" style="flex:1;min-width:120px">
        <input class="field" id="tk-${tr.id}" placeholder="→ trailer" title="Swap only: the trailer taken here" style="width:96px">
        <input class="field" id="mt-${tr.id}" placeholder="meet" title="Swap only: meet code shared with the partner truck, e.g. M1" style="width:64px">
        <input class="field" id="sh-${tr.id}" type="number" min="0" value="2" style="width:58px"><span class="u" style="font-size:11.5px;color:var(--text3)">h</span>
        <input class="field" id="sm-${tr.id}" type="number" min="0" max="59" value="0" style="width:58px"><span class="u" style="font-size:11.5px;color:var(--text3)">m</span>
        <button class="btn primary sm" onclick="A.addSeg('${tr.id}')">Add segment</button>
      </div>
    </div>

    ${wk.length||warn?`<div class="warns">
      ${wk.map(w=>`<div class="wl info">${I.clock}<span>${w}</span></div>`).join("")}
      ${warn}</div>`:""}
  </div>`;
}

function renderDrivers(drv){
  const view=document.getElementById("view");
  const mon=mondayOf(state.date);
  const q=state.q;
  let keys=Object.keys(drv).sort((a,b)=>drv[b].dates.length-drv[a].dates.length||drv[a].name.localeCompare(drv[b].name));
  if(q)keys=keys.filter(k=>drv[k].name.toLowerCase().includes(q));
  if(!keys.length){view.innerHTML=`<div class="empty">
    <div class="eh">${q?"No driver matches":"No drivers yet"}</div>
    <div class="es">${q?`Nothing for “${esc(q)}”.`:"Name the drivers on the board and their weekly hours appear here."}</div></div>`;return}

  view.innerHTML=`<div style="font-size:11.5px;color:var(--text3);margin-bottom:12px;font-weight:600;letter-spacing:.3px">
      FIXED WEEK ${dayLabel(mon).dm} – ${dayLabel(addDays(mon,6)).dm} · Mon–Sun as defined by Reg 561/2006
    </div><div class="dcards">`+
  keys.map(k=>{
    const r=drv[k];
    const wk=r.weeks[mon]||{drive:0,ext:[]};
    const prev=r.weeks[addDays(mon,-7)]||{drive:0,ext:[]};
    const two=wk.drive+prev.drive;
    const worst=r.issues.reduce((m,i)=>RANK[i.level]>RANK[m]?i.level:m,"ok");
    const lastRest=[...r.rests].reverse().find(x=>x.t==="weekly"||x.t==="weekly-reduced");
    const initials=r.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
    const barEl=(v,max)=>`<div class="bar"><div style="width:${Math.min(100,v/max*100)}%;background:${
      v>max?"var(--bad)":v/max>.85?"var(--risk)":"var(--ok)"}"></div></div>`;
    const days=[...Array(7)].map((_,i)=>{const d=addDays(mon,i);const dd=r.days[d];
      const ext=dd&&dd.drive>540;
      return `<div class="daychip${d===state.date?" today":""}${dd?"":" off"}${ext?" ext":""}">${WD[i]}<b>${dd?fmtHM(dd.drive):"—"}</b></div>`}).join("");
    return `<div class="dcard">
      <div class="dtop">
        <div class="av">${esc(initials)}</div>
        <div class="n">${esc(r.name)}<small>${r.dates.length} day${r.dates.length===1?"":"s"} planned</small></div>
        <span class="pill ${worst}">${SL[worst]}</span>
      </div>
      <div class="bars">
        <div><div class="bl"><span>Week driving</span><b>${fmtHM(wk.drive)} / 56h00</b></div>${barEl(wk.drive,56*60)}</div>
        <div><div class="bl"><span>Two-week total</span><b>${fmtHM(two)} / 90h00</b></div>${barEl(two,90*60)}</div>
      </div>
      <div class="dstats">
        <div class="s">10H DAYS<b style="${wk.ext.length>2?"color:var(--bad-t)":""}">${wk.ext.length} / 2</b></div>
        <div class="s">WEEK LEFT<b>${fmtHM(Math.max(0,56*60-wk.drive))}</b></div>
        <div class="s">LAST WEEKLY REST<b>${lastRest?(lastRest.t==="weekly"?"regular ≥45h":"reduced "+fmtHM(lastRest.gap)):"none in data"}</b></div>
      </div>
      ${r.comp.length?`<div class="warns">${r.comp.map(c=>
        `<div class="wl risk">${I.clock}<span>Rest compensation <b>${fmtHM(c.owe)}</b> due by ${dayLabel(c.due).dm} (from ${c.lbl})</span></div>`).join("")}</div>`:""}
      ${r.issues.length?`<div class="warns">${r.issues.map(i=>
        `<div class="wl ${i.level}">${I.alert}<span>${esc(i.msg)}</span></div>`).join("")}</div>`:""}
      <div class="daychips" style="margin-top:12px">${days}</div>
    </div>`}).join("")+`</div>`;
}

// The key belongs where somebody would look for it, which is not inside a panel
// headed "Import tours". Its own button, its own drawer, opened straight from the
// Measure button when there is no key yet.
function renderMaps(){
  const box=document.getElementById("mapbox");
  if(!state.mapsOpen){box.innerHTML="";return}
  const k=mapKey(), o=mapOpts();
  box.innerHTML=`<div class="imp">
    <div class="ehd" style="color:var(--brand-d)">Distances from Google Maps — optional</div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:11px">
      With a key, the <b>Measure</b> button on a tour asks Google for the distance and driving time of
      every leg at once. Without one, kilometres are simply typed into the <b>km</b> box on each leg
      and everything else works exactly as before.<br>
      Nothing leaves this device until you press Measure, and only that one tour's places go.
      The key is kept on this device beside the board — it is never written into a CSV or a backup,
      so a file handed to somebody else cannot carry it. Distances already measured stay on the board
      with no signal.<br>
      <b style="color:var(--text)">Google routes for cars.</b> Bridge heights, axle weights and lorry
      bans are not in these numbers: a good first figure, not a route a 40-tonne vehicle is known to fit.<br>
      It also <b>times</b> for a car. Across the EU a lorry over 3.5 t is held to 80 km/h on the motorway
      where a car runs 120–130, so the map's figure arrives too early — and a slot buffer that flatters
      the plan is worse than none. Give the fleet's real average and every leg is timed at that instead.
      A lorry is never quicker than the car, so where Google's own figure is the slower one — a city
      leg, a jam — that figure stands and the speed is ignored. Leave the box empty to keep Google's
      timing untouched.
    </div>
    <div class="improw" style="flex-wrap:wrap">
      <input class="field" id="mapkey" type="password" autocomplete="off" placeholder="Google Maps API key"
        value="${esc(k)}" style="width:280px" onchange="A.mapKey(this.value)">
      <span class="kmv" style="color:${k?"var(--ok-t)":"var(--text3)"}">${k?"key stored on this device":"no key yet"}</span>
      <label class="check ${o.traffic?"on":""}"><input type="checkbox" ${o.traffic?"checked":""} onchange="A.mapOpt('traffic',this.checked)">Live traffic</label>
      <label class="check ${o.tolls?"on":""}"><input type="checkbox" ${o.tolls?"checked":""} onchange="A.mapOpt('tolls',this.checked)">Avoid tolls</label>
      <span style="font-size:12.5px;color:var(--text2)">Lorry speed</span>
      <input class="field" type="number" min="0" max="130" value="${o.kmh||""}" placeholder="e.g. 70" style="width:88px"
        title="Average a loaded lorry actually holds on your routes, door to door. Leave empty to use Google's own timing."
        onchange="A.mapOpt('kmh',Math.max(0,Math.min(130,parseInt(this.value)||0)))">
      <span style="font-size:12.5px;color:var(--text3)">km/h</span>
      <div style="flex:1"></div>
      ${k?`<button class="btn" onclick="A.mapKey('')">Forget key</button>`:""}
      <button class="btn" onclick="A.mapsToggle()">Close</button>
    </div>
    <div class="fmt">To measure a tour: fill <b>Starts from</b> on the truck and <b>drives to…</b> on every
driving leg, then press <b>Measure</b> in the Segments card. Google fills each leg's distance and time.
Correct a leg's minutes by hand afterwards and that figure stands — re-measuring shows the map's
number beside it as ≠ rather than overwriting what you decided.</div>
  </div>`;
}
function renderImport(){
  const box=document.getElementById("importbox");
  if(!state.importOpen){box.innerHTML="";return}
  const prev=document.getElementById("csvtext");
  const keep=prev?prev.value:"";
  const rep=state.importReport;
  box.innerHTML=`<div class="imp">
    <div class="ehd" style="color:var(--brand-d)">Import tours — CSV file, or paste straight from Excel / a TMS export</div>
    <textarea id="csvtext" placeholder="Paste rows here, or choose a file below…"></textarea>
    <div class="improw">
      <input type="file" id="csvfile" accept=".csv,.txt,.tsv" style="display:none" onchange="A.importFile(this)">
      <input type="file" id="bakfile" accept=".json" style="display:none" onchange="A.restorePick(this)">
      <button class="btn" onclick="document.getElementById('csvfile').click()">Choose file…</button>
      <label class="radio"><input type="radio" name="impmode" value="replace" checked>Replace day</label>
      <label class="radio"><input type="radio" name="impmode" value="append">Add to day</label>
      <div style="flex:1"></div>
      <button class="btn" onclick="A.importExample()">Load example</button>
      <button class="btn primary" onclick="A.importRun()">Import</button>
    </div>
    <div class="improw" style="border-top:1px dashed var(--line);padding-top:11px;margin-top:12px">
      <span style="font-size:12.5px;color:var(--text2)">A CSV holds one day. To move or keep <b>everything</b>, use a backup file:</span>
      <div style="flex:1"></div>
      <button class="btn" onclick="A.backup()">Download backup</button>
      <button class="btn" onclick="document.getElementById('bakfile').click()">Restore backup…</button>
    </div>
    ${rep?`<div class="warns">
      <div class="wl ${rep.restored||rep.added?"info":"violation"}">${rep.restored||rep.added?I.check:I.alert}<span>${
        rep.restored?esc(rep.restored):
        rep.added+" truck"+(rep.added===1?"":"s")+" imported"+(rep.dates.length?" → "+rep.dates.join(", "):"")+
        (rep.skipped?" · "+rep.skipped+" skipped (60 per day cap)":"")}</span></div>
      ${rep.errors.slice(0,6).map(e=>`<div class="wl violation">${I.alert}<span>${esc(e)}</span></div>`).join("")}
      ${rep.errors.length>6?`<div class="wl violation">${I.alert}<span>…${rep.errors.length-6} more</span></div>`:""}
    </div>`:""}
    <div class="fmt">truck ; driver ; driver2 ; crew ; trailer ; from ; date ; start ; slot ; extended ; arrived ; breaks ; segments
segments = type:minutes:label | …    type: drive · drive2 (crew) · other · swap · break
a swap label may carry #TRAILER (the trailer taken) and @CODE (meet point), e.g. swap:40:Meet A2 #TR-9004 @M1
a driving leg may carry ~KM and >PLACE, e.g. drive:3h10:To meet point ~220 >Bad Oeynhausen, DE
from = the yard the tour starts from, the first place a measured distance runs from
any stop may carry !HH:MM (its own booked slot) and =HH:MM (when the driver reached it)
breaks = breaks the driver actually took, as clock:minutes — 11:15:45|15:40:30 (a trailing + means still standing)
minutes: 300 or 5h00 or 5:30    date: YYYY-MM-DD, empty = the open day    crew / extended: 1 or empty
Only truck and segments are required; columns may be in any order.
Delimiter detected automatically (; , or TAB) — pasting from Excel works.</div>
  </div>`;
  if(keep&&!rep)document.getElementById("csvtext").value=keep;
  if(rep)delete state.importReport;
}

// ---------- init ----------
try{const t=localStorage.getItem("tachoplan-theme");if(t)state.theme=t}catch(e){}
applyTheme();
const Q=new URLSearchParams(location.search);
if(Q.has("demo")){state.demo=true;state.days=demoData()}
else load();
if(Q.get("view")==="drivers")state.view="drivers";
const openName=Q.get("open");
if(openName){const t=curTrucks().find(t=>t.name===openName);if(t)state.openId=t.id}
if(Q.get("theme")==="dark"||Q.get("theme")==="light"){state.theme=Q.get("theme");applyTheme()}
// ?q= makes a filtered board shareable: a link can open straight on one truck
// or one driver, which is how the tool gets shown in a demo.
if(Q.get("q")){state.q=Q.get("q").trim().toLowerCase();
  const el=document.getElementById("q");if(el)el.value=Q.get("q")}
render();

// A dispatcher leaves this open for a whole shift, so the board has to keep its
// own time: without this the "now" line, the progress veil and every ETA would
// stay frozen at the moment the page was opened — worse than showing no clock.
// Typing is never interrupted: a re-render mid-edit would drop the caret.
function liveTick(){
  if(state.date!==todayStr()||state.view!=="board")return false;
  // Re-rendering replaces the DOM, so anything the user is currently working
  // with — a field being typed into, a button about to be pressed — would lose
  // focus mid-action. Wait for the next tick instead.
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ae.tagName))return false;
  render();return true;
}
setInterval(liveTick,30000);

// PWA: offline support when served over http(s); skipped for file:// use
if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
